  harness.instantSort = true;
  console.log = () => {};                        // 검사 중 흐름 로그(뽑기 n/7 등)는 숨김 — 결과는 끝에 짧게
  cancelSortTimers();
}
function endHarness() {
  renderDirty = true; renderRested = false;      // 다듬기(최적화): 검사 뒤 첫 프레임은 반드시 다시 그림
  try {
    CONFIG.selectionMode = harnessSaved.mode;
    setSeed(harnessSaved.seed);
    replay.pending = false;
    replay.hadFocus = false;
    restoreScreenPhysics();                      // 화면용 물리 세계로 되돌림
    resetSimulation();
  } catch (e) {
    console.error('검사 뒤 되돌리기 중 오류', e);
  }
  clearResultBar();
  console.log = harnessSaved.log;
  harness.active = false;
  harness.instantSort = false;
  lastTime = performance.now();
  updateStartButton();
}
// 한 회차를 처음부터: 새 물리 세계 → 시드 → 처음 배치 (rand는 시드를 정한 뒤 resetSimulation에서 처음 쓰임)
function prepareRun(seed, mode) {
  CONFIG.selectionMode = mode === 'random' ? 'random' : 'physics';
  useTestPhysics();
  setSeed(seed);
  replay.pending = false;
  resetSimulation();
  clearResultBar();
  return physicsSteps;
}
function harnessStep() {
  stepOnce();
  checkReplayReady();                            // 화면 루프 대신 여기서 "다시 하기 뒤 준비 완료" 확인
}
function roundCapSteps() {
  const D = CONFIG.draw;
  return Math.round((D.autoTestSettleTime + D.total * (D.mixTime + D.stuckTime + D.randomPathTime + D.showTime + 1) + 10) / CONFIG.fixedStep);
}
// maxSteps까지 물리 진행. until()이 참이 되면 멈추고 true. ctx.onTick(시작 뒤 계산 횟수)를 계산마다 부름
async function advance(ctx, maxSteps, until) {
  for (let i = 0; i < maxSteps; i++) {
    if (until && until()) return true;
    harnessStep();
    if (ctx.onTick) ctx.onTick(physicsSteps - ctx.s0);
    if (++ctx.k % HARNESS_YIELD === 0) await yieldToBrowser();
  }
  return until ? !!until() : true;
}

// ----- 지문(fingerprint): 공 45개 위치를 소수 4자리로 이어 붙인 문자열의 짧은 해시 -----
function fnv1a(str, h) {
  h = h === undefined ? 0x811c9dc5 : h;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}
function hex8(h) {
  return (h >>> 0).toString(16).padStart(8, '0');
}
function snapshotPositions() {                   // 공 번호 순서, 뽑힌 공은 null
  return balls.map(b => {
    if (b.drawn) return null;
    const p = b.body.position;
    return [p.x.toFixed(4), p.y.toFixed(4), p.z.toFixed(4)];
  });
}
function snapshotString(pos) {
  return pos.map(p => p ? p.join(',') : 'x').join(';');
}

// ----- 1. simulate: 빠른 모드로 처음 배치 → 3초 쌓기 → 실제 흐름(3초 섞기·잡기·2초)으로 draws개 -----
async function simulateCore(opts, onCheck) {
  const D = CONFIG.draw, dt = CONFIG.fixedStep;
  const seed = opts.seed === undefined || opts.seed === null ? 1 : opts.seed;
  const draws = Math.min(D.total, Math.max(1, Math.floor(Number(opts.draws) || D.total)));
  const mode = opts.mode === 'random' || opts.mode === 'physics' ? opts.mode : harnessSaved.mode;
  const s0 = prepareRun(seed, mode);
  const cpEvery = Math.round(1 / dt);            // 지문 기록: 물리 1초마다
  const checkpoints = [];
  const stuckDraws = [];
  let hash = 0x811c9dc5;
  const record = () => {
    const pos = snapshotPositions();
    const str = snapshotString(pos);
    hash = fnv1a(str + '|', hash);
    checkpoints.push({ t: Math.round((physicsSteps - s0) * dt * 1000) / 1000, hash: hex8(fnv1a(str)), pos });
  };
  record();
  const ctx = {
    s0, k: 0,
    onTick: (e) => {
      if (e % cpEvery === 0) record();
      if (flow.phase === 'waiting' && flow.stuck && !stuckDraws.includes(flow.index + 1)) stuckDraws.push(flow.index + 1);
      if (onCheck && e % CHECK_EVERY_STEPS === 0) onCheck(e * dt);
    }
  };
  await advance(ctx, Math.round(D.autoTestSettleTime / dt));
  startDraw();
  const ok = await advance(ctx, roundCapSteps(), () => flow.index >= draws || flow.phase === 'done');
  const finalPos = snapshotPositions();
  hash = fnv1a(snapshotString(finalPos) + '|end', hash);
  const out = {
    seed: seedValue,
    mode,
    draws,
    numbers: flow.numbers.slice(0, draws),
    physicsSeconds: Math.round((physicsSteps - s0) * dt * 1000) / 1000,
    fingerprint: { hash: hex8(hash), last: finalPos.map(p => p ? p.map(Number) : null) },
    timedOut: !ok,
    stuckDraws
  };
  if (opts.keepCheckpoints) out.checkpoints = checkpoints;   // 차등 검사용 (1초마다 위치)
  return out;
}
async function simulate(opts) {
  if (!harnessReady('simulate')) return null;
  beginHarness();
  try {
    return await simulateCore(opts || {}, null);
  } finally {
    endHarness();
  }
}

// ----- 2. checkInvariants: 지금 상태에서 깨지면 안 되는 규칙 검사 -----
function checkInvariants() {
  const f = [];
  const total = CONFIG.ballCount;
  const nums = flow.numbers;
  if (balls.length !== total) f.push(`공 수가 ${balls.length}개 (45개여야 함)`);
  const onTray = Math.min(flow.index, nums.length);
  const trayIdx = new Map();
  for (let i = 0; i < onTray; i++) trayIdx.set(nums[i], i);
  let inWorldN = 0, drawnN = 0, placed = 0;
  for (const b of balls) {
    if ((b.body.world === world) !== b.inWorld) f.push(`${b.number}번: 물리 세계 기록과 실제가 다름`);
    const places = [];
    if (!b.drawn) {
      if (b.inWorld) { places.push('물리 세계'); inWorldN++; }
    } else {
      drawnN++;
      if (b.inWorld && !pendingBallRemovals.includes(b)) f.push(`${b.number}번: 뽑혔는데 물리 세계에 남아 있음`);
      if (trayIdx.has(b.number)) places.push('받침대');
      if (b === flow.current) places.push(b.anim ? '이동 중' : '맨 위 칸');
      else if (b === RandomSelector.ball) places.push('이동 중');
    }
    if (places.length === 1) placed++;
    else f.push(`${b.number}번 공: ${places.length ? places.join('·') + ' 여러 곳에 있음' : '어디에도 없음'}`);
  }
  if (placed !== total) f.push(`공 보존: 정확히 한 곳에 있는 공 ${placed}/45`);
  if (inWorldN + drawnN !== total) f.push(`물리 세계 안 ${inWorldN} + 뽑힌 ${drawnN} = ${inWorldN + drawnN} (45여야 함)`);
  if ((gate.panel.world === world) !== gate.inWorld) f.push('입구 판: 물리 세계 기록과 실제가 다름');

  const seen = new Set();
  for (const n of nums) {
    if (!Number.isInteger(n) || n < 1 || n > 45) f.push(`범위(1~45) 밖 번호: ${n}`);
    if (seen.has(n)) f.push(`중복 번호: ${n}`);
    seen.add(n);
  }
  if (nums.length > CONFIG.draw.total) f.push(`뽑힌 번호가 ${nums.length}개 (최대 7개)`);
  const expectLen = flow.index + (flow.current ? 1 : 0);
  if (nums.length !== expectLen) f.push(`뽑힌 번호 ${nums.length}개가 진행 순서(${flow.index}${flow.current ? ' + 맨 위 칸 1' : ''})와 안 맞음`);
  const movingRandom = RandomSelector.ball && RandomSelector.ball !== flow.current ? 1 : 0;
  if (drawnN !== nums.length + movingRandom) f.push(`뽑힌 공 ${drawnN}개가 뽑힌 번호 ${nums.length}개(+이동 중 ${movingRandom})와 안 맞음`);
  for (let i = 0; i < onTray; i++) {
    const b = balls[nums[i] - 1];
    if (!b) continue;
    if (!b.viewPos || b.anim || b.viewPos.distanceTo(traySlotPos(i)) > 1e-6) f.push(`받침대 ${i + 1}번째 자리에 ${nums[i]}번 공이 없음 (뽑힌 순서와 다름)`);
  }

  // 화면 아래 번호 칸 (자동 점검 중에는 번호 칸을 안 채우므로 건너뜀)
  const sortPending = sortTimers.length > 0;
  if (!autoTest.running) {
    const texts = resultSlotEls.map(el => el.textContent);
    let expected = new Array(resultSlotEls.length).fill('');
    if (flow.phase === 'done' && !sortPending && nums.length === 7) {
      expected = [...sortedMain(nums), nums[6]].map(String);     // 정렬 전환이 끝난 뒤: 앞 6칸 오름차순 + 보너스 = 7번째
    } else {
      for (let i = 0; i < Math.min(onTray, expected.length); i++) expected[i] = String(nums[i]);   // 추첨 중·정렬 전: 뽑힌 순서
    }
    if (texts.join(',') !== expected.join(',')) {
      f.push(`화면 아래 번호 칸 [${texts.map(t => t || '_').join(' ')}] (기대 [${expected.map(t => t || '_').join(' ')}])`);
    }
  }

  if (flow.phase === 'done') {
    if (nums.length !== 7 || flow.index !== 7) f.push(`추첨 완료인데 번호 ${nums.length}개 (7개여야 함)`);
    if (windOn) f.push('추첨 완료인데 바람이 켜져 있음');
  }
  if (flow.phase === 'idle' && !replay.pending && !autoTest.running) {
    if (drawnN) f.push(`시작 전인데 뽑힌 공 ${drawnN}개`);
    if (windOn) f.push('시작 전인데 바람이 켜져 있음');
    if (CONFIG.wind.strength !== 1) f.push(`시작 전인데 바람 배율 ${CONFIG.wind.strength} (1이어야 함)`);
    if (gate.state !== 'closed' || !gate.inWorld || gate.pendingRemove) f.push(`시작 전인데 입구가 닫혀 있지 않음 (${gate.state})`);
    if (suctionOn) f.push('시작 전인데 빨아들이기가 켜져 있음');
    if (pendingBallRemovals.length) f.push(`대기 중 몸체 목록 ${pendingBallRemovals.length}개 (비어 있어야 함)`);
    if (nums.length) f.push(`시작 전인데 뽑힌 번호 ${nums.length}개`);
    if (RandomSelector.ball) f.push('시작 전인데 난수 방식 이동 중인 공이 있음');
    if (balls.some(b => b.viewPos || b.anim)) f.push('시작 전인데 맨 위 칸/받침대 자리가 남아 있음');
  }
  const out = countOutside();                    // 입구 길 예외 규칙은 countOutside 그대로
  if (out) f.push(`통 밖 공 ${out}개`);
  return { ok: f.length === 0, failures: f, phase: flow.phase, index: flow.index, physicsSec: Math.round(getPhysicsTime() * 100) / 100, sortPending };
}

// ----- 번호 칸 명암비·공 색 규칙 -----
function contrastRatio(a, b) {
  const la = hexLuminance(a), lb = hexLuminance(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}
function checkSlotContrast() {
  const f = [];
  for (let n = 1; n <= 45; n++) {
    const bg = getSlotColor(n);
    const r = contrastRatio(bg, readableTextColor(bg));
    if (r < 4.5) f.push(`${n}번 칸 명암비 ${r.toFixed(2)}:1 (4.5:1 미만)`);
  }
  return f;
}
function checkBallColorRule() {
  // 번호대 규칙 (CLAUDE.md 공 색): 1~10, 11~20, 21~30, 31~40, 41~45가 각각 한 색이고 묶음끼리는 서로 다른 색인지만 확인
  // (색 값 자체는 getBallColor에서만 정함 — 여기에 따로 적지 않음)
  const bands = [[1, 10], [11, 20], [21, 30], [31, 40], [41, 45]];
  const f = [];
  const bandColors = [];
  for (const [a, b] of bands) {
    const c = getBallColor(a);
    for (let n = a + 1; n <= b; n++) if (getBallColor(n) !== c) f.push(`${n}번 공 색 ${getBallColor(n)}이 같은 번호대(${a}~${b}) ${a}번 색 ${c}와 다름`);
    bandColors.push([`${a}~${b}`, c]);
  }
  for (let i = 0; i < bandColors.length; i++) {
    for (let j = i + 1; j < bandColors.length; j++) {
      if (bandColors[i][1] === bandColors[j][1]) f.push(`번호대 ${bandColors[i][0]}와 ${bandColors[j][0]}의 색이 같음 (${bandColors[i][1]})`);
    }
  }
  return f;
}

// ----- 3. quickCheck: 수 초 안에 끝나는 빠른 점검 -----
async function quickCheck(opts) {
  opts = opts || {};
  const seed = opts.seed === undefined || opts.seed === null ? 1 : opts.seed;
  const t0 = performance.now();
  const failures = [];
  const seenMsg = new Set();
  const add = (where, msg) => {
    if (seenMsg.has(msg)) return;                // 같은 내용은 처음 한 번만
    seenMsg.add(msg);
    if (failures.length < 30) failures.push(`${where} — ${msg}`);
  };
  if (!harnessReady('빠른 점검')) return { pass: false, failures: ['준비가 안 됐거나 다른 검사가 진행 중'], seconds: 0 };
  let sim = null;
  beginHarness();
  try {
    sim = await simulateCore({ seed, draws: CONFIG.draw.total }, (relSec) => {
      const r = checkInvariants();
      if (!r.ok) for (const m of r.failures) add(`시드 ${seed}, 물리 ${relSec.toFixed(2)}초, 단계 ${r.phase} ${Math.min(r.index + 1, 7)}/7`, m);
    });
    const r = checkInvariants();
    if (!r.ok) for (const m of r.failures) add(`시드 ${seed}, 추첨 완료 직후`, m);
    if (sim.timedOut) add(`시드 ${seed}`, '7개를 다 뽑기 전에 시간 초과');
    if (sim.numbers.length !== 7) add(`시드 ${seed}`, `뽑힌 번호 ${sim.numbers.length}개 (7개여야 함)`);
    if (sim.stuckDraws.length) add(`시드 ${seed}`, `끼임 발생 (${sim.stuckDraws.join(', ')}번째 뽑기)`);
  } catch (e) {
    add(`시드 ${seed}`, '오류: ' + (e && e.message ? e.message : e));
  } finally {
    endHarness();
  }
  const after = checkInvariants();
  if (!after.ok) for (const m of after.failures) add('검사 뒤 되돌린 상태', m);
  for (const m of checkSlotContrast()) add('번호 칸 명암비', m);
  for (const m of checkBallColorRule()) add('공 색 규칙', m);
  const v = validateBallNumbers(balls);
  if (!v.ok) add('공 번호', v.message);
  const seconds = Math.round((performance.now() - t0) / 100) / 10;
  const pass = failures.length === 0;
  if (pass) console.log(`빠른 점검: 통과 (${seconds}초)`);
  else console.log(`빠른 점검: 실패 ${failures.length}건 (${seconds}초)\n - ` + failures.join('\n - '));
  return { pass, failures, seconds, numbers: sim ? sim.numbers : null };
}

// ----- 4. propertyTest: 무작위 시점에 다시 하기 → 깨끗한 시작 전 → 다시 7개 → 완료 규칙 -----
// atPhysicsSec = 시작 버튼을 누른 뒤 물리 시간(초). 같은 시드·같은 시점이면 빠른 모드에서 같은 결과가 재현된다.
const PROP_TARGETS = ['mixing', 'waiting', 'showing', 'done', 'any'];
async function propertyRun(runSeed, mode, plan) {
  const D = CONFIG.draw, dt = CONFIG.fixedStep;
  const s0 = prepareRun(runSeed, mode);
  const T = plan.target || null;
  let stage = '다시 하기 전';
  let failure = null;
  let resetStep = plan.resetStep === undefined || plan.resetStep === null ? null : plan.resetStep;
  let trigPhase = null, trigIndex = 0;
  const mk = (msg) => ({
    seed: runSeed, mode,
    atPhysicsSec: resetStep === null ? null : Math.round(resetStep * dt * 1000) / 1000,
    phase: trigPhase || flow.phase,
    drawIndex: Math.min((trigPhase ? trigIndex : flow.index) + 1, D.total),
    stage, message: msg, resetStep
  });
  const ctx = {
    s0, k: 0,
    onTick: (e) => {
      if (failure || e % CHECK_EVERY_STEPS !== 0) return;
      const r = checkInvariants();
      if (!r.ok) failure = mk(`${r.phase} 중 규칙 깨짐: ${r.failures.join(' / ')}`);
    }
  };
  await advance(ctx, Math.round(D.autoTestSettleTime / dt), () => !!failure);
  if (failure) return { failure };
  startDraw();
  const start = physicsSteps;
  const cap = roundCapSteps();
  if (resetStep === null && T && T.phase === 'any') resetStep = Math.floor(T.frac * 62 / dt);
  const maxDelay = { mixing: D.mixTime, waiting: 0.5, showing: D.showTime, done: 2 };
  let reached = -1;
  const due = () => {
    if (failure) return true;
    const e = physicsSteps - start;
    if (resetStep !== null) return e >= resetStep;
    const here = T.phase === 'done' ? flow.phase === 'done' : (flow.phase === T.phase && flow.index === T.drawIndex);
    if (reached < 0) {
      if (!here) return false;
      reached = e;
    }
    if (!here || e - reached >= Math.floor(T.frac * maxDelay[T.phase] / dt)) {
      resetStep = e;
      return true;
    }
    return false;
  };
  const ok = await advance(ctx, cap, due);
  if (failure) return { failure };
  if (!ok) return { failure: mk('다시 하기 시점에 가기 전에 시간 초과') };

  trigPhase = flow.phase;
  trigIndex = flow.index;
  stage = '다시 하기 누름';
  if (!startReplay()) return { failure: mk(`다시 하기가 동작하지 않음 (단계 ${flow.phase})`) };
  stage = '다시 하기 뒤 준비 중';
  const readyOk = await advance(ctx, Math.round((replay.maxWait + 1) / dt), () => !!failure || !replay.pending);
  if (failure) return { failure };
  if (!readyOk || replay.pending) return { failure: mk('다시 하기 뒤 준비 완료가 안 됨') };
  stage = '다시 하기 직후(준비 완료)';
  let r = checkInvariants();
  if (!r.ok) return { failure: mk(r.failures.join(' / ')) };
  if (flow.phase !== 'idle') return { failure: mk(`준비 완료인데 단계가 ${flow.phase}`) };
  if (startBtn.textContent !== '시작' || startBtn.disabled) return { failure: mk(`시작 버튼이 "시작"(눌림 가능)이 아님: "${startBtn.textContent}"`) };
  stage = '다시 뽑기';
  if (!startDraw()) return { failure: mk('다시 시작이 안 됨') };
  const doneOk = await advance(ctx, cap, () => !!failure || flow.phase === 'done');
  if (failure) return { failure };
  if (!doneOk) return { failure: mk('7개를 다 뽑기 전에 시간 초과') };
  stage = '다시 뽑기 완료';
  r = checkInvariants();
  if (!r.ok) return { failure: mk(r.failures.join(' / ')) };
  return { failure: null, resetStep };
}
// 실패가 재현되는 가장 이른 시점 찾기: 같은 시드에서 다시 하기 시점을 앞당겨 가며 (이분 탐색, 최대 8번)
// 같은 단계(stage)에서 같은 실패 메시지가 나올 때만 "재현"으로 셈 (다른 실패로 바뀐 것은 재현 아님)
async function minimizeFailure(f) {
  if (f.resetStep === null || f.resetStep === undefined || f.stage === '다시 하기 전' || f.stage === '오류') return f;
  let lo = 0, hi = f.resetStep, best = f;
  for (let i = 0; i < 8 && hi - lo > 12; i++) {
    const mid = Math.floor((lo + hi) / 2);
    const r = await propertyRun(f.seed, f.mode, { resetStep: mid });
    if (r.failure && r.failure.stage === f.stage && r.failure.message === f.message) { hi = mid; best = r.failure; }
    else lo = mid;
  }
  return best;
}
async function propertyTest(opts) {
  opts = opts || {};
  const runs = Math.max(1, Math.floor(Number(opts.runs) || 200));
  const seed = opts.seed === undefined || opts.seed === null ? 1 : (Math.trunc(Number(opts.seed)) || 0);
  const onProgress = typeof opts.onProgress === 'function' ? opts.onProgress : null;
  if (!harnessReady('속성 검사')) {
    return { pass: false, runs: 0, failures: [{ seed: null, atPhysicsSec: null, phase: null, message: '준비가 안 됐거나 다른 검사가 진행 중' }] };
  }
  const t0 = performance.now();
  const pick = mulberry32((seed ^ 0x5bd1e995) >>> 0);   // 회차 시드·다시 하기 시점을 정하는 난수 (물리 난수와 따로)
  const failures = [];
  const minimal = [];
  let done = 0;
  beginHarness();
  try {
    for (let r = 0; r < runs; r++) {
      const runSeed = 1 + Math.floor(pick() * 2147483646);
      const mode = r % 10 === 9 ? 'random' : 'physics';     // 10회 중 1회는 난수 방식(곡선 이동 중 다시 하기 포함)
      const target = { phase: PROP_TARGETS[Math.floor(pick() * PROP_TARGETS.length)], drawIndex: Math.floor(pick() * CONFIG.draw.total), frac: pick() };
      let res;
      try {
        res = await propertyRun(runSeed, mode, { target });
      } catch (e) {
        res = { failure: { seed: runSeed, mode, atPhysicsSec: null, phase: flow.phase, drawIndex: flow.index + 1, stage: '오류', message: String(e && e.message ? e.message : e) } };
      }
      done++;
      if (res.failure) {
        failures.push(res.failure);
        if (minimal.length < 3) {
          try { minimal.push(await minimizeFailure(res.failure)); } catch (e) { minimal.push(res.failure); }
        }
      }
      if (onProgress) { try { onProgress(done, runs, failures.length); } catch (e) { /* 진행 표시 오류는 무시 */ } }
    }
  } finally {
    endHarness();
  }
  const seconds = Math.round((performance.now() - t0) / 100) / 10;
  const pass = failures.length === 0;
  const fmt = (x) => `시드 ${x.seed}(${x.mode}), 시작 뒤 물리 ${x.atPhysicsSec}초, 단계 ${x.phase} ${x.drawIndex}/7, ${x.stage}: ${x.message}`;
  if (pass) console.log(`속성 검사: 통과 (${done}회, ${seconds}초)`);
  else console.log(`속성 검사: 실패 ${failures.length}/${done}회 (${seconds}초)\n - ` + failures.slice(0, 10).map(fmt).join('\n - ') +
    (minimal.length ? '\n 가장 이른 재현 시점(최소 사례):\n - ' + minimal.map(fmt).join('\n - ') : ''));
  return { pass, runs: done, failures, minimal, seconds };
}

// ----- 5. profilePhysics: 바람 켜고 물리 1스텝 시간을 엔진 단계별·우리 처리별로 -----
async function profilePhysics(opts) {
  opts = opts || {};
  const seconds = Math.max(1, Number(opts.seconds) || 10);
  const seed = opts.seed === undefined || opts.seed === null ? 1 : opts.seed;
  if (!harnessReady('물리 시간 측정')) return null;
  const dt = CONFIG.fixedStep;
  const now = () => performance.now();
  const eng = { broadphase: 0, narrowphase: 0, makeContactConstraints: 0, solve: 0, integrate: 0 };
  const our = { wind: 0, suction: 0, cap: 0, net: 0, mix: 0, flow: 0, outside: 0 };
  let total = 0, steps = 0, swapped = false;
  const outsideSteps = Math.max(1, Math.round(CONFIG.outsideCheckInterval / dt));
  const profWind = () => { const t = now(); applyWind(); our.wind += now() - t; };
  const profSuction = () => { const t = now(); applySuction(); our.suction += now() - t; };
  const profPost = () => {                       // onPostStep과 같은 일을 같은 순서로 + 시간 재기
    physicsSteps++;
    let t = now(); capBallSpeeds(); our.cap += now() - t;
    t = now(); applySafetyNet(); our.net += now() - t;
    t = now(); recordMixStats(); our.mix += now() - t;
    if (windOn && (physicsSteps - windStartStep) % outsideSteps === 0) { t = now(); countOutside(); our.outside += now() - t; }
    t = now(); if (gate.state === 'closing') pushGateRegionDown(); drawFlowStep(); our.flow += now() - t;
  };
  let strength = 1;
  beginHarness();
  try {
    prepareRun(seed, harnessSaved.mode);
    await advance({ s0: physicsSteps, k: 0, onTick: null }, Math.round(CONFIG.draw.autoTestSettleTime / dt));
    swapped = true;                              // 교체 도중 예외가 나도 finally에서 복구하도록 먼저 세움
    world.removeEventListener('preStep', applyWind);
    world.removeEventListener('preStep', applySuction);
    world.removeEventListener('postStep', onPostStep);
    world.addEventListener('preStep', profWind);
    world.addEventListener('preStep', profSuction);
    world.addEventListener('postStep', profPost);
    world.doProfiling = true;
    setWind(true);
    if (opts.strength !== undefined && opts.strength !== null) CONFIG.wind.strength = Number(opts.strength) || 1;
    strength = CONFIG.wind.strength;
    const n = Math.round(seconds / dt);
    for (let i = 0; i < n; i++) {
      const t = now();
      stepOnce();
      total += now() - t;
      steps++;
      for (const key in eng) eng[key] += world.profile[key] || 0;
      if ((i + 1) % HARNESS_YIELD === 0) await yieldToBrowser();
    }
  } finally {
    world.doProfiling = false;
    if (swapped) {
      world.removeEventListener('preStep', profWind);
      world.removeEventListener('preStep', profSuction);
      world.removeEventListener('postStep', profPost);
      world.addEventListener('preStep', applyWind);
      world.addEventListener('preStep', applySuction);
      world.addEventListener('postStep', onPostStep);
    }
    endHarness();
  }
  if (!steps) return null;
  const parts = [
    ['엔진: 넓은 범위 충돌 찾기 (broadphase)', eng.broadphase],
    ['엔진: 접촉 계산 (narrowphase)', eng.narrowphase],
    ['엔진: 접촉 조건 만들기 (makeContactConstraints)', eng.makeContactConstraints],
    ['엔진: 접촉 풀기 (solve)', eng.solve],
    ['엔진: 위치 갱신 (integrate)', eng.integrate],
    ['우리: 바람 (preStep)', our.wind],
    ['우리: 빨아들이기 (preStep)', our.suction],
    ['우리: 속도 상한 (postStep)', our.cap],
    ['우리: 안전망 (postStep)', our.net],
    ['우리: 섞임 기록·통 밖 세기 (postStep)', our.mix],
    ['우리: 뽑기 흐름 (postStep)', our.flow]
  ];
  const sum = parts.reduce((a, p) => a + p[1], 0);
  parts.push(['기타 (엔진 나머지·몸체 넣고 빼기)', Math.max(0, total - sum)]);
  const rows = parts.map(([name, ms]) => ({ 항목: name, '1스텝 평균(ms)': Number((ms / steps).toFixed(4)), '비율(%)': Number((ms / total * 100).toFixed(1)) }));
  rows.push({ 항목: '(참고) 통 밖 세기만 — 위 섞임 기록에 포함, 0.25초마다 한 번 더 재서 추정', '1스텝 평균(ms)': Number((our.outside / steps).toFixed(4)), '비율(%)': Number((our.outside / total * 100).toFixed(1)) });
  const stepMs = Math.round(total / steps * 10000) / 10000;
  console.log(`물리 시간 측정: 바람 ${seconds}초(배율 ${strength}), ${steps}스텝, 1스텝 평균 ${stepMs}ms`);
  console.table(rows);
  return { seconds, seed, strength, steps, stepMsAvg: stepMs, rows };
}

// ----- 6. layoutCheck: 지금 창 크기에서 화면 겹침·가로 스크롤·버튼 크기·하단 문구 -----
function layoutCheck() {
  const f = [];
  const W = window.innerWidth, H = window.innerHeight;
  const TOL = 1;
  const rnd = (r) => `위 ${Math.round(r.top)}, 아래 ${Math.round(r.bottom)}, 왼쪽 ${Math.round(r.left)}, 오른쪽 ${Math.round(r.right)}`;
  // 3D 통·맨 위 칸·받침대·앞 받침대가 그려지는 영역 (카메라 맞춤에 쓰는 점들을 화면 좌표로)
  const tmp = new THREE.Vector3();
  const drum = { left: Infinity, right: -Infinity, top: Infinity, bottom: -Infinity };
  camera.updateMatrixWorld(true);
  for (const p of getFitPoints()) {
    tmp.copy(p).project(camera);
    const sx = (tmp.x + 1) / 2 * W, sy = (1 - tmp.y) / 2 * H;
    drum.left = Math.min(drum.left, sx); drum.right = Math.max(drum.right, sx);
    drum.top = Math.min(drum.top, sy); drum.bottom = Math.max(drum.bottom, sy);
  }
  if (drum.top < -TOL || drum.left < -TOL || drum.right > W + TOL || drum.bottom > H + TOL) f.push(`3D 통 영역이 화면 밖으로 나감 (${rnd(drum)})`);
  const ui = [['번호 칸', resultBarEl.getBoundingClientRect()], ['배속 줄', speedRowEl.getBoundingClientRect()], ['버튼 줄', btnRowEl.getBoundingClientRect()], ['하단 문구', footerEl.getBoundingClientRect()]];
  const overlap = (a, b) => a.left < b.right - TOL && b.left < a.right - TOL && a.top < b.bottom - TOL && b.top < a.bottom - TOL;
  for (const [name, r] of ui) {
    if (overlap(drum, r)) f.push(`3D 통 영역(아래 끝 ${Math.round(drum.bottom)}px)이 ${name}(위 끝 ${Math.round(r.top)}px)과 겹침`);
    if (r.left < -TOL || r.right > W + TOL || r.top < -TOL || r.bottom > H + TOL) f.push(`${name}이 화면 밖으로 나감 (${rnd(r)})`);
  }
  for (let i = 0; i < ui.length; i++) {
    for (let j = i + 1; j < ui.length; j++) if (overlap(ui[i][1], ui[j][1])) f.push(`${ui[i][0]}과 ${ui[j][0]}이 겹침`);
  }
  const de = document.documentElement;
  if (de.scrollWidth > de.clientWidth + TOL) f.push(`가로 스크롤 생김 (내용 폭 ${de.scrollWidth}px > 화면 ${de.clientWidth}px)`);
  for (const [name, btn] of [['시작 버튼', startBtn], ['다시 하기 버튼', replayBtn]]) {
    const r = btn.getBoundingClientRect();
    if (r.height < 44 - 0.5) f.push(`${name} 높이 ${r.height.toFixed(1)}px (44px 이상이어야 함)`);
    if (r.left < -TOL || r.right > W + TOL) f.push(`${name}이 화면 옆으로 잘림`);
  }
  // 배속 버튼 5개 (2026-11-24): 높이 36px 이상, 화면 옆으로 안 잘림, 글자가 버튼 밖으로 안 넘침, 모두 한 줄
  const speedTops = [];
  for (const btn of speedBtnEls) {
    const r = btn.getBoundingClientRect();
    const name = `배속 ${btn.textContent} 버튼`;
    if (r.height < 36 - 0.5) f.push(`${name} 높이 ${r.height.toFixed(1)}px (36px 이상이어야 함)`);
    if (r.left < -TOL || r.right > W + TOL) f.push(`${name}이 화면 옆으로 잘림`);
    if (btn.scrollWidth > btn.clientWidth + TOL || btn.scrollHeight > btn.clientHeight + TOL) f.push(`${name} 글자가 버튼 밖으로 넘침(줄바꿈)`);
    speedTops.push(r.top);
  }
  if (speedTops.length && Math.max(...speedTops) - Math.min(...speedTops) > TOL) f.push('배속 버튼 5개가 한 줄에 다 안 들어감');
  const fs = getComputedStyle(footerEl);
  if (fs.display === 'none' || fs.visibility === 'hidden' || Number(fs.opacity) === 0) f.push('하단 문구가 보이지 않음');
  const text = footerEl.textContent;
  if (!text.includes('재미용 시뮬레이터이며 공식 추첨·실제 복권과 무관함')) f.push('하단 안내 문구가 없음');
  if (!text.includes('엘제유')) f.push('제작자 표기가 없음');
  for (const span of footerEl.querySelectorAll('span')) {
    const r = span.getBoundingClientRect();
    if (r.width < 1 || r.top < -TOL || r.bottom > H + TOL || r.left < -TOL || r.right > W + TOL) f.push(`하단 문구 "${span.textContent}"가 화면 안에 다 안 보임 (${rnd(r)})`);
  }
  return { ok: f.length === 0, failures: f, size: `${W}x${H}`, drum: { top: Math.round(drum.top), bottom: Math.round(drum.bottom) } };
}

// ===== 다듬기(최적화, 2026-11-24): 그리기를 쉬어도 되는지 — 성능용(배터리 절약), 화면 조정값 아님 =====
// 아래가 모두 참이면 화면에 움직이는 것이 하나도 없어 그림이 바뀌지 않는다:
// 로딩 끝남, 자동 점검·검사 중 아님, 바람 꺼짐, 빨아들이기 꺼짐, 추첨 흐름 없음(시작 전 또는 추첨 완료),
// 다시 하기 준비 중 아님, 난수 방식 곡선 이동 없음, 입구 닫힘(닫는 중·뺄 판·뺄 공 없음),
// 통 안 공은 모두 잠듦(깨어 있는 공 0개), 뽑힌 공은 이동 애니메이션(칸으로 올라가기·곡선) 없음.
// 화면 크기·화질·카메라 변경 직후와 탭 복귀 직후는 renderDirty로 따로 한 번 더 그림.
// (뽑힌 공의 lookAt은 카메라가 고정이라 카메라가 바뀔 때만 달라짐 → renderDirty가 맡음)
function canRestRender() {
  if (!firstFrameDone) return false;
  if (autoTest.running || harness.active) return false;
  if (windOn || suctionOn) return false;
  if (flow.phase !== 'idle' && flow.phase !== 'done') return false;
  if (replay.pending) return false;
  if (RandomSelector.ball) return false;
  if (gate.state !== 'closed' || gate.pendingRemove || pendingBallRemovals.length) return false;
  for (const b of balls) {
    if (b.drawn) {
      if (b.anim) return false;
    } else if (!b.inWorld || b.body.sleepState !== CANNON.Body.SLEEPING) {
      return false;
    }
  }
  return true;
}

// ===== 반복 실행 (매 프레임) =====
function frame(now) {
  rafId = requestAnimationFrame(frame);
  if (document.hidden) return;

  const rawMs = now - lastTime;    // 5단계 성능 측정용: 제한 전 실제 프레임 간격
  let dt = rawMs / 1000;
  lastTime = now;
  // 자동 점검 중에는 화면 루프가 물리를 돌리지 않고 그리지도 않음 (이중 계산 금지)
  if (autoTest.running || harness.active) return;   // 다듬기: 검사 함수 실행 중에도 같음
  if (!(dt > 0)) dt = 0;
  dt = Math.min(dt, CONFIG.maxDt); // 탭 전환 후 복귀해도 공이 튀지 않게 (실제 시간 상한 — 배속을 곱하기 전에 자름)

  // 화면이 느려 한 프레임에 maxSubSteps를 넘게 계산해야 하면 남는 시간은 버림 → 공이 튀지 않는 대신 물리가 느려짐.
  // 이 느려짐은 perfReport의 "물리 속도 %"(목표 대비)로 확인
  // 배속(2026-11-24): 엔진에 넘기는 경과 시간만 dt × 배속. 계산 간격 fixedStep은 그대로, 한 프레임 최대 계산 수는 getMaxSubSteps()
  // (배속을 바꿔도 엔진에 남은 자투리 시간은 그대로 이어지므로 흐름이 끊기거나 공이 튀지 않음)
  let frameSteps = 0, framePhysMs = 0;
  if (dt > 0) {
    const s0 = physicsSteps;
    const t0 = performance.now();
    world.step(CONFIG.fixedStep, dt * simSpeed, getMaxSubSteps());
    framePhysMs = performance.now() - t0;
    frameSteps = physicsSteps - s0;
    flushBodyChanges();
    simTime += dt;
  }
  checkReplayReady();              // 4단계: 다시 하기 후 공이 다 쌓였는지

  // 다듬기(최적화): 멈춰 있을 때 그리기 쉬기 (성능용, 화면 조정값 아님). 물리는 위에서 이미 매 프레임 진행함.
  // 쉬는 조건이 처음 참이 된 프레임은 한 번 더 그려서 최종 모습을 남기고, 그 뒤부터 쉼. 조건이 깨지면 바로 다시 매 프레임 그림
  const canRest = canRestRender();
  const skipRender = canRest && renderRested && !renderDirty;
  if (!skipRender) {
    // 물리 위치를 화면 공에 반영 (부드럽게 보이도록 보간된 위치 사용)
    // 벽은 물리 엔진의 판 콜라이더가 처리하므로 보간 위치를 따로 되돌리지 않는다.
    // 뽑힌 공은 물리 대신 맨 위 칸·앞 받침대 위치에 놓고 번호가 카메라를 보게 함
    // 다듬기(최적화): 쉬기 전 마지막 1프레임은 보간 위치 대신 잠든 공의 실제 위치를 씀
    // (잠든 공은 다음 물리 계산에서 보간 위치가 실제 위치와 같아지므로, 계속 그렸을 때의 최종 모습과 같음)
    const finalRest = canRest;
    const tNow = getDisplayPhysicsTime();   // 배속: 자투리 시간까지 더한 물리 시각 (0.5배에서도 이동이 부드럽게)
    for (const b of balls) {
      if (b.drawn) {
        updateDrawnMesh(b, tNow);
        continue;
      }
      b.mesh.position.copy(finalRest ? b.body.position : b.body.interpolatedPosition);
      b.mesh.quaternion.copy(finalRest ? b.body.quaternion : b.body.interpolatedQuaternion);
    }

    renderer.render(scene, camera);
    renderDirty = false;
    renderRested = canRest;
  }
  renderSkipping = skipRender;

  if (!firstFrameDone) {
    firstFrameDone = true;
    hideLoading();
    updateStartButton();           // 로딩이 끝난 뒤에만 시작 버튼 사용 가능
  } else {
    perfRecordFrame(rawMs, frameSteps, framePhysMs, skipRender);   // 5단계: 성능 기록 (첫 프레임은 준비 시간이 섞여 빼고 셈)
  }

  periodicOutsideCheck();
}

// 탭이 숨겨지면 멈추고, 돌아오면 시간 기준을 새로 잡는다
function onVisibilityChange() {
  if (document.hidden) {
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null;
  } else {
    lastTime = performance.now();
    renderDirty = true;            // 다듬기(최적화): 탭으로 돌아오면 그리기를 쉬던 중이어도 한 번 다시 그림 (화면이 지워졌을 경우 대비)
    if (rafId === null) rafId = requestAnimationFrame(frame);
  }
}

// ===== 배속 선택 (2026-11-24) =====
// 버튼 5개(0.5·1·1.5·2·3배) 중 하나만 선택. 추첨 중에도 바꿀 수 있음 (다음 프레임부터 그 빠르기로 이어짐).
// 고른 배속은 이 브라우저에 기억(localStorage). 읽기·쓰기에 실패해도(사생활 보호 모드 등) 1배로 정상 동작
function readSavedSpeed() {
  try {
    const v = Number(window.localStorage.getItem(SPEED_STORAGE_KEY));
    if (SPEED_OPTIONS.includes(v)) return v;
  } catch (e) { /* 저장소를 못 쓰면 1배 */ }
  return 1;
}
function saveSpeed(v) {
  try {
    window.localStorage.setItem(SPEED_STORAGE_KEY, String(v));
  } catch (e) { /* 저장 실패는 무시 (이번 방문 동안은 그대로 동작) */ }
}
// 선택 표시(aria-checked)와 키보드 이동용 tabindex(선택된 버튼만 Tab으로 들어옴)
function updateSpeedButtons() {
  for (const btn of speedBtnEls) {
    const on = Number(btn.dataset.speed) === simSpeed;
    btn.setAttribute('aria-checked', on ? 'true' : 'false');
    btn.tabIndex = on ? 0 : -1;
  }
}
function setSimSpeed(v, save = true) {
  v = Number(v);
  if (!SPEED_OPTIONS.includes(v)) {
    console.warn(`배속은 ${SPEED_OPTIONS.join(', ')} 중 하나여야 합니다: ${v}`);
    return simSpeed;
  }
  if (v !== simSpeed) {
    simSpeed = v;
    SPEED_LAG.lowBuckets = 0;                    // 못 따라가는지 판단은 새 배속으로 처음부터
  }
  updateSpeedButtons();
  if (save) saveSpeed(v);
  updatePerfBox();
  return simSpeed;
}
function setupSpeedButtons() {
  setSimSpeed(readSavedSpeed(), false);
  for (const btn of speedBtnEls) {
    btn.addEventListener('click', () => setSimSpeed(btn.dataset.speed));
  }
  // 화살표 키(←↑ 이전, →↓ 다음, 끝에서 처음으로 돌아감), Home(처음), End(끝): 선택을 옮기고 포커스도 같이 옮김
  speedRowEl.addEventListener('keydown', (e) => {
    const i = speedBtnEls.indexOf(document.activeElement);
    if (i < 0) return;
    const n = speedBtnEls.length;
    let j = null;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') j = (i + 1) % n;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') j = (i - 1 + n) % n;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = n - 1;
    if (j === null) return;
    e.preventDefault();
    setSimSpeed(speedBtnEls[j].dataset.speed);
    speedBtnEls[j].focus();
  });
}

// ===== 시작 =====
async function init() {
  // 1) 라이브러리 불러오기
  try {
    THREE = await import('three');
    CANNON = await import('cannon-es');
  } catch (e) {
    console.error(e);
    showError('라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
    return;
  }

  // 2) WebGL 확인
  if (!isWebGLAvailable()) {
    showError('이 기기/브라우저에서는 3D 화면(WebGL)을 사용할 수 없습니다. 최신 Chrome·Safari·Edge에서 열어 주세요.');
    return;
  }

  // 다듬기: 주소에 ?seed=정수 가 있으면 고정 난수로 시작 (없으면 아무것도 바뀌지 않음)
  const urlSeed = readUrlSeed();
  if (urlSeed !== null) {
    setSeed(urlSeed);
    console.log(`고정 난수 모드: seed=${urlSeed} (같은 결과는 그리지 않는 빠른 모드에서만 보장)`);
  }

  // 3) 화면·물리 준비
  try {
    chamberBallPos = new THREE.Vector3(DRUM_CENTER.x, CHAMBER_BALL_Y, DRUM_CENTER.z);
    createScene();
    createDrumVisual();
    createTrayVisual();     // 기계 앞 받침대 (7자리)
    createPhysicsWorld();   // 속도 상한·안전망·뽑기 흐름은 여기서 postStep에 연결됨
    createDrumCollider();   // 통 벽 = 축구공식 판 162장 (맨 위 오각형 = 입구 마개)
    createChamberCollider();// 맨 위 칸 벽 + 덮개
    createBalls();
  } catch (e) {
    console.error(e);
    showError('추첨기를 준비하는 중 문제가 생겼습니다. 페이지를 새로 고쳐 주세요.');
    return;
  }

  // 4) 공 번호 점검
  const result = validateBallNumbers(balls);
  console.log(result.message);

  // 콘솔에서 직접 점검할 수 있게 공개
  window.lottoSim = {
    validateBallNumbers: () => validateBallNumbers(balls),
    countOutside: () => countOutside(),
    countSleeping: () => countSleeping(),
    physicsTime: () => getPhysicsTime(),
    safetyNetHits: () => safetyNetHits,
    setWind: (on) => setWind(on),
    isWindOn: () => windOn,
    mixStats: () => getMixStats(),
    drawState: () => getDrawState(),
    runAutoTest: (n, options) => runAutoTest(n, options),
    perfReport: () => perfReport(),   // 5단계: 최근 10초 성능 요약
    // 다듬기: 검사 도구 (검사/index.html 페이지와 콘솔에서 사용)
    setSeed: (n) => setSeed(n),
    getSeed: () => getSeed(),
    simulate: (o) => simulate(o),
    checkInvariants: () => checkInvariants(),
    quickCheck: (o) => quickCheck(o),
    propertyTest: (o) => propertyTest(o),
    profilePhysics: (o) => profilePhysics(o),
    layoutCheck: () => layoutCheck(),
    // 배속 (2026-11-24): 화면 모드 빠르기만 바꿈 (검사 함수는 배속과 무관)
    setSpeed: (v) => setSimSpeed(v),
    getSpeed: () => simSpeed,
    autoTestResult: null,
    config: CONFIG
  };

  // 시작 버튼: 한 번 누르면 7개 뽑기가 끝까지 자동으로 진행 (멈춤 기능 없음). "시작" 상태에서만 동작
  startBtn.addEventListener('click', () => {
    if (autoTest.running || harness.active || !firstFrameDone) return;
    startDraw();
  });
  // 다시 하기 버튼 (따로 있음): 추첨 중이면 중단하고, 추첨 완료 뒤면 그대로 처음 상태로 되돌림
  replayBtn.addEventListener('click', () => {
    if (autoTest.running || harness.active || !firstFrameDone) return;
    startReplay();
  });
  // 배속 버튼 (2026-11-24): 저장된 배속 불러오기 + 클릭·화살표 키
  setupSpeedButtons();

  // 5단계: 화면 크기 바뀜 (창 크기·폰 돌리기·주소창 나타남/사라짐)
  window.addEventListener('resize', scheduleResize);
  window.addEventListener('orientationchange', onOrientationChange);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);
  document.addEventListener('visibilitychange', onVisibilityChange);

  // 5단계: 주소 끝에 ?fps=1 이 있으면 성능 측정 표시를 켬
  try {
    PERF.enabled = new URLSearchParams(window.location.search).get('fps') === '1';
  } catch (e) {
    PERF.enabled = false;
  }
  if (PERF.enabled) {
    PERF.boxEl = document.getElementById('perfBox');
    PERF.boxEl.hidden = false;
    PERF.boxEl.textContent = '성능 측정 중…';
  }

  lastTime = performance.now();
  rafId = requestAnimationFrame(frame);
}

init();
</script>
</body>
</html>
