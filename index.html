<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 공 추첨기 시뮬레이터</title>
<style>
  /* ===== 기본 화면 스타일 ===== */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    /* 오리지널 배경: 부드러운 남색 원형 그라데이션 */
    background: radial-gradient(ellipse at 50% 40%, #2b3a63 0%, #18213d 55%, #0d1326 100%);
    background-color: #0d1326;
    color: #e8ecf5;
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  #app {
    position: fixed;
    inset: 0;
    touch-action: manipulation;   /* 화면 두 번 탭 확대 방지 */
  }
  #app canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ===== 로딩 안내 (첫 화면이 그려질 때까지 보임) ===== */
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
    text-align: center;
    font-size: 18px;
    line-height: 1.6;
    background: rgba(13, 19, 38, 0.92);
    z-index: 20;
    transition: opacity 0.4s ease;
  }
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #loading.error {
    color: #ffb4b4;
  }

  /* ===== 화면 하단 안내 문구 (항상 보임) ===== */
  #footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    /* 5단계: 아이폰 아래 홈 막대 영역(safe-area-inset-bottom)만큼 하단 여백, 가로로 눕힌 폰의 노치 쪽 좌우 여백 */
    padding: 6px max(12px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    text-align: center;
    font-size: 12px;
    line-height: 1.5;
    color: #c9d1e3;
    background: rgba(8, 12, 26, 0.55);
    z-index: 10;
    word-break: keep-all;
  }
  #footer span {
    display: inline-block;
    margin: 0 6px;
  }

  /* ===== 버튼 줄 (하단 문구 바로 위): 시작 버튼 + 다시 하기 버튼을 한 줄로 ===== */
  /* 가로 320px 화면에서도 한 줄에 들어가게 글자 크기·좌우 여백을 줄이고 줄바꿈 금지 */
  #btnRow {
    position: fixed;
    left: 50%;
    bottom: 48px;                      /* 실제 위치는 JS가 하단 문구 높이에 맞춰 다시 정함 */
    transform: translateX(-50%);
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
    z-index: 15;
  }

  /* ===== 시작 버튼 (오리지널 디자인). 추첨 중에는 주황색 + 잠김 ===== */
  #startBtn {
    min-width: 120px;
    min-height: 48px;                  /* 폰에서 누르기 쉬운 크기 (최소 44px 이상) */
    padding: 0 18px;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 24px;
    background: linear-gradient(180deg, #4fc3a1 0%, #2e9b80 100%);
    color: #ffffff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.04em;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #startBtn.on {
    background: linear-gradient(180deg, #f0a352 0%, #d27a2c 100%);
  }
  #startBtn:disabled {
    opacity: 0.45;
    cursor: default;
  }
  #startBtn.on:disabled {
    opacity: 0.85;                     /* 추첨 중에는 잠겨 있어도 글자(n/7)가 잘 보이게 */
  }
  #startBtn:not(:disabled):active {
    transform: scale(0.97);
  }
  #startBtn:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 3px;
  }

  /* ===== 다시 하기 버튼 (보조 버튼: 테두리 위주, 오리지널 디자인) ===== */
  #replayBtn {
    min-width: 96px;
    min-height: 48px;
    padding: 0 16px;
    border: 2px solid rgba(220, 230, 250, 0.7);
    border-radius: 24px;
    background: rgba(8, 12, 26, 0.35);
    color: #ffffff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.04em;
    white-space: nowrap;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #replayBtn:not(:disabled):hover {
    background: rgba(255, 255, 255, 0.1);
  }
  #replayBtn:disabled {
    opacity: 0.4;
    cursor: default;
  }
  #replayBtn:not(:disabled):active {
    transform: scale(0.97);
  }
  #replayBtn:focus-visible {
    outline: 3px solid #ffffff;
    outline-offset: 3px;
  }

  /* ===== 번호 표시 (4단계, 오리지널 디자인: 둥근 반투명 받침 위 원형 칸 7개, 시작 버튼 바로 위) ===== */
  /* 칸 지름은 화면 폭에 맞춰 줄어듦 (최소 28px, 최대 46px). 가로 300px 화면에서도 한 줄에 들어감 */
  #resultBar {
    --slot: clamp(28px, calc((100vw - 48px) / 9), 46px);
    position: fixed;
    left: 50%;
    bottom: 120px;                     /* 실제 위치는 JS가 시작 버튼 위로 다시 정함 */
    transform: translateX(-50%);
    display: flex;
    align-items: flex-start;
    gap: calc(var(--slot) * 0.14);
    padding: 6px calc(var(--slot) * 0.3);
    border-radius: calc(var(--slot) * 0.6);
    background: rgba(8, 12, 26, 0.38);
    white-space: nowrap;
    z-index: 12;
    pointer-events: none;
  }
  #resultBar .slotWrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #resultBar .slot {
    box-sizing: border-box;
    width: var(--slot);
    height: var(--slot);
    border-radius: 50%;
    border: 2px solid rgba(220, 230, 250, 0.28);   /* 빈 칸: 옅은 테두리 원 */
    background: rgba(255, 255, 255, 0.04);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--slot) * 0.44);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #resultBar .slot.filled {
    border-color: rgba(255, 255, 255, 0.55);
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.16), 0 2px 6px rgba(0, 0, 0, 0.3);
    animation: slotPop 0.3s ease-out;
  }
  /* 추첨이 끝난 뒤 번호 정렬 전환: 일반 6칸이 살짝 사라졌다가(0.17초) 정렬된 번호로 다시 나타남(0.17초)
     배속: JS가 --sort-fade를 0.17초 ÷ 배속으로 바꿈 (3배면 약 0.057초) */
  #resultBar .slot {
    transition: opacity var(--sort-fade, 0.17s) ease, transform var(--sort-fade, 0.17s) ease;
  }
  #resultBar .slot.sortHide {
    opacity: 0;
    transform: scale(0.7);
  }
  #resultBar .plus {
    height: var(--slot);
    display: flex;
    align-items: center;
    font-size: calc(var(--slot) * 0.5);
    font-weight: 700;
    color: #c9d1e3;
    padding: 0 calc(var(--slot) * 0.04);
  }
  #resultBar .bonusLabel {
    margin-top: 2px;
    font-size: 10px;
    line-height: 1.2;
    color: #c9d1e3;
  }
  @keyframes slotPop {
    0%   { transform: scale(0.4); opacity: 0.2; }
    70%  { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    #resultBar .slot.filled { animation: none; }
    #resultBar .slot { transition: none; }
  }
  /* ===== 5단계: 버튼 누름 느낌·두 번 탭 확대 방지 (두 버튼 공통) ===== */
  #startBtn, #replayBtn {
    -webkit-user-select: none;
    user-select: none;
    transition: transform 0.08s ease, filter 0.08s ease;
  }
  #startBtn:not(:disabled):active,
  #replayBtn:not(:disabled):active {
    filter: brightness(0.9);           /* 누르는 동안 살짝 어둡게 + 작아짐(위의 scale) */
  }

  /* ===== 배속 선택 줄 (2026-11-24, 오리지널 디자인): 번호 칸과 버튼 줄 사이. 5개 중 하나만 선택 =====
     가로 300px 화면에서도 한 줄 (라벨 + 버튼 5개 ≈ 265px). 실제 위치(bottom)는 JS(layoutBottomUI)가 정함 */
  #speedRow {
    position: fixed;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 4px;
    padding: 2px 5px;
    border-radius: 22px;
    background: rgba(8, 12, 26, 0.38);
    white-space: nowrap;
    z-index: 14;
  }
  #speedRow .speedLabel {
    padding: 0 2px 0 5px;
    font-size: 11px;
    color: #c9d1e3;
    -webkit-user-select: none;
    user-select: none;
  }
  #speedRow .speedBtn {
    box-sizing: border-box;
    min-width: 42px;
    min-height: 40px;                  /* 누르기 쉬운 높이 (낮은 화면에서는 36px) */
    padding: 0 6px;
    border: 1px solid transparent;
    border-radius: 20px;
    background: transparent;
    color: #e8ecf5;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  #speedRow .speedBtn:hover {
    background: rgba(255, 255, 255, 0.1);
  }
  /* 선택된 배속: 시작 버튼과 같은 계열의 민트색 바탕 + 진한 글자(명암비 약 8.5:1) + 굵은 글자 */
  #speedRow .speedBtn[aria-checked="true"] {
    background: #4fc3a1;
    border-color: rgba(255, 255, 255, 0.6);
    color: #0d1326;
    font-weight: 800;
  }
  #speedRow .speedBtn:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 1px;
  }

  /* ===== 5단계: 좁은 세로 폰 (가로 360px 이하) — 하단 문구 줄 수 줄이기 (화면 조정값) ===== */
  @media (max-width: 360px) {
    #footer { font-size: 11px; }
    #footer span { margin: 0 3px; }
  }

  /* ===== 5단계: 높이가 낮은 화면 (가로로 눕힌 폰 등, 높이 500px 이하) =====
     JS(layoutBottomUI)가 body에 compact를 붙임. 번호 칸·버튼은 최소 44px 유지, 여백·글자만 줄임 (화면 조정값) */
  body.compact #footer {
    padding-top: 2px;
    padding-bottom: calc(2px + env(safe-area-inset-bottom));
    font-size: 10px;
    line-height: 1.35;
  }
  body.compact #footer span { margin: 0 4px; }
  body.compact #btnRow { gap: 8px; }
  body.compact #startBtn,
  body.compact #replayBtn {
    min-height: 44px;
    font-size: 14px;
    padding: 0 14px;
    border-radius: 22px;
  }
  body.compact #speedRow { padding: 1px 4px; }
  body.compact #speedRow .speedBtn {
    min-height: 36px;
    font-size: 13px;
    border-radius: 18px;
  }
  body.compact #speedRow .speedLabel { font-size: 10px; }
  body.compact #startBtn { min-width: 104px; }
  body.compact #replayBtn { min-width: 88px; }
  body.compact #resultBar {
    --slot: clamp(28px, calc((100vw - 48px) / 9), 44px);  /* 폭이 넉넉하면 44px */
    padding: 3px calc(var(--slot) * 0.3);
  }
  body.compact #resultBar .bonusLabel {
    margin-top: 1px;
    font-size: 9px;
    line-height: 1.1;
  }

  /* ===== 5단계: 성능 측정 표시 (주소 끝에 ?fps=1 일 때만 보임) ===== */
  #perfBox {
    position: fixed;
    top: calc(6px + env(safe-area-inset-top));
    left: calc(6px + env(safe-area-inset-left));
    padding: 4px 7px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.55);
    color: #d8ffe9;
    font: 11px/1.35 ui-monospace, Consolas, monospace;
    white-space: pre;
    z-index: 30;
    pointer-events: none;
  }
  #perfBox[hidden] { display: none; }

  /* 화면 읽기 프로그램에만 들리는 글자 (화면에는 안 보임) */
  .srOnly {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    border: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>

<!-- ===== 라이브러리 (정확한 버전으로 고정, 2026-11-23 npm에서 확인) =====
     2026-11-24 다듬기(최적화): 같은 버전(three 0.187.0, cannon-es 0.20.0)의 압축판(.min.js)으로 바꿈 — 내려받는 크기만 줄고 동작은 같음.
     크기(압축 전 바이트): 원본 three.module.js 658,900 + three.core.js 1,474,799 + cannon-es.js 346,256 = 약 2.48MB
                        → 압축판 three.module.min.js 392,177 + three.core.min.js 422,062 + cannon-es.min.js 139,855 = 약 0.95MB (약 62% 감소)
     - three.module.min.js 안에서 "./three.core.js"(압축 안 된 판)를 불러오므로, 아래 두 번째 줄(전체 주소 키)로
       그 주소를 압축판 three.core.min.js로 바꿔 끼운다 → three 핵심 파일이 두 번(원본 + 압축판) 불리지 않음.
     - cannon-es는 공식 압축판이 없어 jsDelivr가 0.20.0 원본을 자동 압축한 파일(버전 고정 그대로).
     (importmap 안에는 주석을 쓸 수 없어 여기에 적음) -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.min.js",
  "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.core.js": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.core.min.js",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.min.js"
}}
</script>
</head>
<body>
<div id="app"></div>
<div id="loading">추첨기 준비 중…</div>
<!-- 5단계: 성능 측정 표시 (주소 끝에 ?fps=1 을 붙였을 때만 보임) -->
<div id="perfBox" aria-hidden="true" hidden></div>
<!-- 번호 표시 (4단계): 일반 6칸 + "+" + 보너스 1칸. 화면 읽기 프로그램에는 srOnly 글자로 결과를 읽어 줌 -->
<div id="resultBar" aria-live="polite" aria-label="추첨 결과 표시">
  <div class="slotWrap" aria-hidden="true"><div class="slot"></div></div>
  <div class="slotWrap" aria-hidden="true"><div class="slot"></div></div>
  <div class="slotWrap" aria-hidden="true"><div class="slot"></div></div>
  <div class="slotWrap" aria-hidden="true"><div class="slot"></div></div>
  <div class="slotWrap" aria-hidden="true"><div class="slot"></div></div>
  <div class="slotWrap" aria-hidden="true"><div class="slot"></div></div>
  <div class="plus" aria-hidden="true">+</div>
  <div class="slotWrap" aria-hidden="true"><div class="slot"></div><div class="bonusLabel">보너스</div></div>
  <span id="resultSr" class="srOnly"></span>
</div>
<!-- 배속 선택 (2026-11-24): 물리 시간이 실제 시간보다 몇 배 빨리 흐르는지. 한 번에 하나만 선택 (화살표 키로 이동 가능) -->
<div id="speedRow" role="radiogroup" aria-labelledby="speedLabel">
  <span id="speedLabel" class="speedLabel">배속</span>
  <button type="button" class="speedBtn" role="radio" aria-checked="false" tabindex="-1" data-speed="0.5" aria-label="0.5배속">0.5×</button>
  <button type="button" class="speedBtn" role="radio" aria-checked="true" tabindex="0" data-speed="1" aria-label="1배속">1×</button>
  <button type="button" class="speedBtn" role="radio" aria-checked="false" tabindex="-1" data-speed="1.5" aria-label="1.5배속">1.5×</button>
  <button type="button" class="speedBtn" role="radio" aria-checked="false" tabindex="-1" data-speed="2" aria-label="2배속">2×</button>
  <button type="button" class="speedBtn" role="radio" aria-checked="false" tabindex="-1" data-speed="3" aria-label="3배속">3×</button>
</div>
<div id="btnRow">
  <button id="startBtn" type="button" disabled>시작</button>
  <button id="replayBtn" type="button" disabled>다시 하기</button>
</div>
<div id="footer">
  <span>재미용 시뮬레이터이며 공식 추첨·실제 복권과 무관함</span>
  <span>제작: 엘제유</span>
</div>

<script type="module">
// =====================================================================
// 3D 공 추첨기 시뮬레이터 — 1단계: 통 + 공 45개가 바닥에 쌓인 화면
//                           2단계: 시작 버튼 → 바람에 섞이기
//                           3단계: 시작 버튼 한 번 → 맨 위 입구로 공 7개(6개 + 보너스) 자동 뽑기
//                           4단계: 화면 아래 번호 표시(6개 + 보너스) + 다시 하기 버튼
//                           5단계: 폰 화면 배치·성능 측정(?fps=1, lottoSim.perfReport())·자동 화질 낮추기
//                           다듬기: 검사 도구(고정 난수 ?seed=, lottoSim.simulate/quickCheck/propertyTest 등)
//                           다듬기: 최적화(라이브러리 압축판, 멈춰 있을 때 화면 그리기 쉬기)
//                           다듬기: 배속 버튼(0.5·1·1.5·2·3배, 2026-11-24)
// =====================================================================

// 라이브러리는 init 안에서 동적으로 불러온다 (실패하면 안내 문구를 보여주기 위해)
let THREE = null;
let CANNON = null;

// ===== 현실 수치 (출처 불확실) =====
// 출처 불확실: TF 뉴스 기사 기준이며 공식 자료 아님.
const REAL_BALL_MASS_G = 4;        // 출처 불확실: 4g(±5%)
const REAL_BALL_SIZE_MM = 44.5;    // 출처 불확실: 기사엔 '둘레'로 표기, 지름일 가능성 있음(확인 못 함). 여기서는 지름으로 가정.

// ===== 화면/물리 변환 규칙 =====
// 1) 길이: 공 반지름을 BALL_R(0.5단위)로 둔다. 즉 공 지름 1단위 = 실제 44.5mm(가정).
//    SCALE = BALL_R*2 / (REAL_BALL_SIZE_MM/1000) → 실제 1m가 약 22.5단위.
// 2) 통 크기는 공 지름의 배수로 정함 (현실 통 크기는 확인 못 함)
// 3) 질량: 모든 공 같은 질량(상대값 1). 실제 4g을 그대로 쓰면 물리 엔진이 불안정해질 수 있어 상대값 사용

// ===== 다듬기: 고정 난수 (2026-11-24, 검사용) =====
// 모든 무작위는 rand() 하나를 거친다. 시드가 없으면 Math.random 그대로 (평소와 완전히 같음).
// 주소에 ?seed=정수 가 있거나 lottoSim.setSeed(n)을 부르면 그 시드로 시작하는 고정 난수(mulberry32).
// 주의: "같은 시드 → 같은 결과"는 그리지 않는 빠른 모드(자동 점검·lottoSim.simulate 등)에서만 보장한다.
//       화면 모드(그리면서 돌 때)는 프레임 시간에 따라 한 프레임에 도는 물리 계산 수, 몸체 넣고 빼는 시점,
//       엔진 시간(world.time)이 달라져 같은 시드라도 결과가 달라질 수 있다.
let seedValue = null;      // 지금 쓰는 시드 (없으면 null = Math.random)
let seededNext = null;     // 고정 난수 함수 (없으면 null)
function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rand() {
  return seededNext ? seededNext() : Math.random();
}
// n이 null/undefined면 Math.random으로 돌아감. 같은 n으로 다시 부르면 처음부터 같은 순서로 다시 시작
function setSeed(n) {
  if (n === null || n === undefined || n === '') {
    seedValue = null;
    seededNext = null;
    return null;
  }
  const v = Math.trunc(Number(n));
  if (!Number.isFinite(v)) {
    console.warn(`시드는 정수여야 합니다: ${n}`);

// ===== 화면 아래 번호 표시 (4단계, HTML 겹침 요소) =====

function hexLuminance(hex) {
  const v = parseInt(hex.slice(1), 16);
  const ch = [(v >> 16) & 255, (v >> 8) & 255, v & 255].map(c => {
    c /= 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);

  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}

  return withDark >= withWhite ? DARK : '#ffffff';
}

const SORT_FADE_MS = 170;          // 화면용: 사라지는 시간 (1배 기준, CSS 변수 --sort-fade 기본 0.17s와 같게)

  if (prefersReducedMotion()) {

  const delayMs = SORT_DELAY_MS / simSpeed;

// ===== 공 번호 텍스처 (오리지널 디자인) =====
// 바탕색 + 흰 원형 라벨 2개(앞·뒤, u=0.25와 u=0.75) + 진한 번호 글자
// 방향: three.js 구 모양에서 u=0.25는 공의 +Z 쪽, u=0.75는 -Z 쪽, 그림 위쪽 = 공의 +Y 쪽.
//       그래서 공의 +Z 축을 카메라 쪽으로 돌리면(mesh.lookAt) 번호가 똑바로 보인다.
function makeBallTexture(n) {
  const w = 256, h = 128;
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  // 바탕색
  ctx.fillStyle = getBallColor(n);
  ctx.fillRect(0, 0, w, h);

  // 앞·뒤 두 곳에 라벨과 번호
  const centers = [w * 0.25, w * 0.75];
  for (const cx of centers) {
    const cy = h / 2;
    // 라벨 테두리 (살짝 어두운 고리)
    ctx.beginPath();
    ctx.arc(cx, cy, 46, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
    ctx.fill();
    // 흰 원형 라벨
    ctx.beginPath();
    ctx.arc(cx, cy, 43, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    // 번호 글자
    ctx.fillStyle = '#1d2230';
    ctx.font = 'bold 56px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(n), cx, cy + 3);
    // 6과 9는 헷갈리지 않게 밑줄 표시
    if (n === 6 || n === 9) {
      ctx.fillRect(cx - 13, cy + 27, 26, 4);
    }
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ===== 장면(화면) 만들기 =====
function createScene() {
  // 렌더러: 폰 성능을 위해 안티앨리어싱·그림자 끔
  renderer = new THREE.WebGLRenderer({
    antialias: false,
    alpha: true,                       // 투명 캔버스 → 뒤의 CSS 배경이 보임
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(getTargetPixelRatio());
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = false;  // 그림자 끔
  document.getElementById('app').appendChild(renderer.domElement);

  scene = new THREE.Scene();

  // 고정 카메라 (사용자 회전 없음)
  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 300);
  updateCamera();

  // 조명 2개 (그림자 없음)
  const hemi = new THREE.HemisphereLight(0xe4ecff, 0x2a3048, 1.6);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 1.6);
  dir.position.set(4, 12, 8);
  scene.add(dir);
}

// ===== 카메라 위치 (화면 비율에 맞춰 통 전체가 보이게) =====
// 버튼 줄(시작 + 다시 하기)을 하단 문구 바로 위에, 배속 줄을 버튼 줄 바로 위에, 번호 표시를 배속 줄 바로 위에 놓는다
// 5단계: 높이가 낮은 화면(CONFIG.compactMaxHeight 이하)이면 body에 compact를 붙여 여백·글자를 줄임 (CSS 참고)
function isCompactLayout() {
  return window.innerHeight <= CONFIG.compactMaxHeight;
}
function layoutBottomUI() {
  const compact = isCompactLayout();
  document.body.classList.toggle('compact', compact);
  const gapFooter = compact ? 4 : 12;            // 화면 조정값: 하단 문구 ↔ 버튼 줄 간격(px)
  const gapSpeed = compact ? 4 : 8;              // 화면 조정값: 버튼 줄 ↔ 배속 줄 간격(px)
  const gapBar = compact ? 4 : 10;               // 화면 조정값: 배속 줄 ↔ 번호 표시 간격(px)
  const btnBottom = footerEl.offsetHeight + gapFooter;
  btnRowEl.style.bottom = btnBottom + 'px';
  // 배속 줄(2026-11-24)은 버튼 줄 바로 위, 번호 표시는 배속 줄 바로 위
  const speedBottom = btnBottom + btnRowEl.offsetHeight + gapSpeed;
  speedRowEl.style.bottom = speedBottom + 'px';
  resultBarEl.style.bottom = (speedBottom + speedRowEl.offsetHeight + gapBar) + 'px';
}
// 화면 아래에서 번호 표시·배속 줄·버튼 줄·하단 문구가 차지하는 높이(px)
function getBottomReservedPx() {
  const top = Math.min(btnRowEl.getBoundingClientRect().top, speedRowEl.getBoundingClientRect().top, resultBarEl.getBoundingClientRect().top);
  const gapTop = isCompactLayout() ? 4 : 8;      // 화면 조정값: 3D 영역 ↔ 번호 표시 사이 여유(px)
  return Math.max(0, window.innerHeight - top + gapTop);
}

// 화면에 꼭 들어와야 하는 점들: 구 겉면, 맨 위 칸 덮개, 받침대 바닥 둘레, 앞 받침대(7자리) 모서리
let fitPoints = null;
function getFitPoints() {
  if (fitPoints) return fitPoints;
  const pts = [];
  const V = (x, y, z) => pts.push(new THREE.Vector3(x, y, z));
  const g = new THREE.IcosahedronGeometry(CONFIG.drumRadius + 0.15, 1);
  const a = g.attributes.position.array;
  for (let i = 0; i < a.length; i += 3) V(a[i] + DRUM_CENTER.x, a[i + 1] + DRUM_CENTER.y, a[i + 2] + DRUM_CENTER.z);
  g.dispose();
  const capR = CHAMBER_OUTER_R + 0.25;
  const capTop = CHAMBER_TOP_Y + 0.45;
  for (let i = 0; i < 8; i++) {
    const t = i / 8 * Math.PI * 2;
    V(Math.cos(t) * capR, capTop, Math.sin(t) * capR);
  }
  for (let i = 0; i < 16; i++) {
    const t = i / 16 * Math.PI * 2;
    V(Math.cos(t) * STAND_BASE_R, 0, Math.sin(t) * STAND_BASE_R);
  }
  const hw = TRAY_HALF_W + 0.1;
  for (const x of [-hw, hw]) {
    for (const z of [TRAY.z - TRAY.depth / 2, TRAY.z + TRAY.depth / 2]) {
      for (const y of [0, TRAY.topY + BALL_R * 2 + 0.1]) V(x, y, z);
    }
  }
  fitPoints = pts;
  return pts;
}

function updateCamera() {
  // 통은 버튼·하단 문구 위쪽 영역에 맞춰 보이게 한다 (아래 setViewOffset 참고)
  layoutBottomUI();
  const W = window.innerWidth;
  const H = window.innerHeight;
  // 5단계: 3D 영역 = 아래 UI(번호 표시·버튼·하단 문구)를 뺀 남은 높이에 정확히 맞춤.
  // (이전의 "최소 화면 높이의 60%"는 높이가 낮은 화면에서 통이 버튼과 겹치게 해서 뺌)
  const usableH = Math.min(H, Math.max(1, H - getBottomReservedPx()));
  const aspect = W / usableH;
  camera.aspect = aspect;
  camera.clearViewOffset();
  camera.updateProjectionMatrix();

  // 카메라는 고정(회전 불가). 앞쪽 약간 위에서 내려다보는 방향은 그대로 두고,
  // 구·맨 위 칸·받침대·앞 받침대(7자리)가 모두 화면 안(가장자리 여유 10%)에 들어오는 가장 가까운 거리를 찾는다.
  const pts = getFitPoints();
  const viewDir = new THREE.Vector3(0, 0.38, 1).normalize();
  const topY = CHAMBER_TOP_Y + 0.45;
  const target = new THREE.Vector3(0, topY / 2 - 0.4, 0);
  const LIM = 0.9;
  const tmp = new THREE.Vector3();
  const place = (dist) => {
    camera.position.copy(target).addScaledVector(viewDir, dist);
    camera.lookAt(target);
    camera.updateMatrixWorld(true);
  };
  const fits = () => {
    for (const p of pts) {
      tmp.copy(p).project(camera);
      if (Math.abs(tmp.x) > LIM || Math.abs(tmp.y) > LIM || tmp.z > 1) return false;
    }
    return true;
  };
  const findDist = () => {
    let lo = 12, hi = 200;
    for (let i = 0; i < 30; i++) {
      const mid = (lo + hi) / 2;
      place(mid);
      if (fits()) hi = mid; else lo = mid;
    }
    return hi;
  };
  let dist = findDist();
  // 위아래 여백이 같아지도록 겨누는 점 높이를 한 번 조정한 뒤 거리를 다시 찾음
  place(dist);
  let yMin = Infinity, yMax = -Infinity;
  for (const p of pts) {
    tmp.copy(p).project(camera);
    if (tmp.y < yMin) yMin = tmp.y;
    if (tmp.y > yMax) yMax = tmp.y;
  }
  const halfH = dist * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  target.y += ((yMax + yMin) / 2) * halfH / Math.cos(Math.atan(0.38));
  dist = findDist();
  place(dist);

  // 위쪽 usableH 영역을 기준으로 맞춘 화면을 전체 높이 H로 그림 → 통이 버튼·하단 문구와 겹치지 않음
  camera.setViewOffset(W, usableH, 0, 0, W, H);
  camera.updateProjectionMatrix();
  renderDirty = true;              // 다듬기(최적화): 카메라가 바뀌었으니 다음 프레임은 반드시 그림
}

let lastSizeKey = '';
function onResize() {
  // 크기·배율이 그대로면 그림 버퍼를 다시 만들지 않음 (폰에서 두 손가락 확대 중 계속 오는 resize 대비)
  const pr = getTargetPixelRatio();
  const key = window.innerWidth + 'x' + window.innerHeight + '@' + pr;
  if (key !== lastSizeKey) {
    lastSizeKey = key;
    renderer.setPixelRatio(pr);
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  updateCamera();                  // 안에서 renderDirty = true (다음 프레임은 반드시 그림)
  // 다듬기(최적화): 그리기를 쉬는 중이면 크기 변경으로 지워진 화면을 바로 다시 그림 (다음 프레임 전 한 장이 비어 보이지 않게)
  if (renderRested && scene && camera) renderer.render(scene, camera);
  updatePerfBox();
}
// 5단계: 화면을 돌리거나 주소창이 나타났다 사라져 높이가 바뀔 때 다시 맞춤.
// resize·orientationchange·visualViewport resize가 한꺼번에 와도 다음 화면 그릴 때 한 번만 처리
let resizeQueued = false;
function scheduleResize() {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => {
    resizeQueued = false;
    if (renderer) onResize();
  });
}
function onOrientationChange() {
  scheduleResize();
  setTimeout(scheduleResize, 350);               // 화면 조정값: 일부 폰은 돌린 직후 크기가 늦게 바뀌어 한 번 더 맞춤
}

// ===== 5단계: 그리는 해상도 배율 (pixelRatio) =====
// 기기 배율, 상한 CONFIG.maxPixelRatio, 자동 화질 낮추기 상한 중 가장 작은 값
function getTargetPixelRatio() {
  return Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio, PERF.qualityCap);
}

// ===== 5단계: 성능 측정 =====
// 1초 단위 묶음(bucket)을 최근 10개만 고정 크기 고리 버퍼에 보관 (매 프레임 배열에 쌓지 않음)
// realMs: 실제 흐른 시간(제한 전 프레임 간격의 합), steps: 물리 계산 횟수, physMs: world.step에 걸린 시간
// (바람·빨아들이기·안전망 등 물리 계산마다 도는 코드 포함), over33: 프레임 간격이 33ms(30fps)를 넘은 프레임 수
// skipped: 다듬기(최적화) — 그리기를 쉰 프레임 수
// targetMs: 배속(2026-11-24) — 목표 물리 시간(ms) = 프레임마다 (실제 프레임 간격 × 그때의 배속)의 합.
//           묶음 도중 배속을 바꿔도 프레임별로 그때 배속을 곱하므로 정확함
const PERF_HISTORY = 10;
function makePerfBucket() {
  return { frames: 0, realMs: 0, steps: 0, physMs: 0, over33: 0, windAll: true, skipped: 0, targetMs: 0 };
}
// 물리 속도 % (배속 기준, 2026-11-24 변경): 실제로 진행된 물리 시간 ÷ 목표 물리 시간(실제 시간 × 배속) × 100.
// 예) 3배 목표인데 실제 2.4배로 돌면 80%. 이전에는 "실제 시간 대비"였음(1배일 때는 두 계산이 같음)
function perfSpeedPct(b) {
  return b && b.targetMs > 0 ? Math.round(b.steps * CONFIG.fixedStep * 1000 / b.targetMs * 100) : null;
}
// 실제 배속 = 진행된 물리 시간 ÷ 실제 흐른 시간
function perfActualSpeed(b) {
  return b && b.realMs > 0 ? b.steps * CONFIG.fixedStep * 1000 / b.realMs : null;
}
function formatSpeed(v) {
  return String(v);                // 0.5, 1, 1.5, 2, 3
}
const PERF = {
  enabled: false,                  // ?fps=1 이면 왼쪽 위에 표시
  boxEl: null,
  ring: Array.from({ length: PERF_HISTORY }, makePerfBucket),
  head: 0,                         // 다음에 쓸 자리
  count: 0,                        // 채워진 묶음 수 (최대 10)
  cur: makePerfBucket(),           // 지금 모으는 1초 묶음
  qualityCap: Infinity,            // 자동 화질 낮추기로 정해진 배율 상한
  windBuckets: 0,                  // 추첨/바람 중에 연달아 모인 묶음 수 (화질 판단용, 낮춘 뒤 0으로)
  lowered: []                      // 낮춘 기록
};
const FRAME_OVER_MS = 1000 / 30;   // 30fps 한 프레임 시간
function copyPerfBucket(dst, src) {
  dst.frames = src.frames; dst.realMs = src.realMs; dst.steps = src.steps;
  dst.physMs = src.physMs; dst.over33 = src.over33; dst.windAll = src.windAll; dst.skipped = src.skipped;
  dst.targetMs = src.targetMs;
}
function resetPerfBucket(b) {
  b.frames = 0; b.realMs = 0; b.steps = 0; b.physMs = 0; b.over33 = 0; b.windAll = true; b.skipped = 0; b.targetMs = 0;
}
// 매 프레임 한 번 호출 (rawMs: 제한 전 프레임 간격, steps: 이번 프레임 물리 계산 횟수, physMs: world.step 시간,
// skipped: 다듬기(최적화) — 이번 프레임에 그리기를 쉬었는지)
function perfRecordFrame(rawMs, steps, physMs, skipped) {
  if (!(rawMs > 0) || rawMs > 1000) return;      // 탭 전환 복귀 등 비정상적으로 긴 간격은 빼고 셈
  const c = PERF.cur;
  c.frames++;
  if (skipped) c.skipped++;
  c.realMs += rawMs;
  c.targetMs += rawMs * simSpeed;                // 배속: 이 프레임의 목표 물리 시간
  c.steps += steps;
  c.physMs += physMs;
  if (rawMs > FRAME_OVER_MS + 0.5) c.over33++;   // 0.5ms는 측정 오차 여유
  if (!(windOn || isDrawing())) c.windAll = false;
  if (c.realMs >= 1000) closePerfBucket();
}
function closePerfBucket() {
  const c = PERF.cur;
  copyPerfBucket(PERF.ring[PERF.head], c);
  const closed = PERF.ring[PERF.head];
  PERF.head = (PERF.head + 1) % PERF_HISTORY;
  PERF.count = Math.min(PERF_HISTORY, PERF.count + 1);
  resetPerfBucket(c);
  checkAutoQuality(closed);
  checkSpeedKeepUp(closed);
  updatePerfBox(closed);
}
// 배속(2026-11-24): 물리가 목표 배속을 못 따라가는지 (목표 대비 90% 미만인 1초 묶음이 3개 연속 = 약 3초 이상)
// → 콘솔에 한 번만 알림 (배속마다 한 번. 화면 문구는 넣지 않음). 배속을 바꾸면 연속 횟수는 처음부터 다시 셈
const SPEED_LAG = { minPct: 90, needBuckets: 3, lowBuckets: 0, warned: new Set() };
function checkSpeedKeepUp(closed) {
  const pct = perfSpeedPct(closed);
  if (pct === null) return;
  if (pct >= SPEED_LAG.minPct) {
    SPEED_LAG.lowBuckets = 0;
    return;
  }
  SPEED_LAG.lowBuckets++;
  if (SPEED_LAG.lowBuckets < SPEED_LAG.needBuckets || SPEED_LAG.warned.has(simSpeed)) return;
  SPEED_LAG.warned.add(simSpeed);
  const s = sumPerf(recentPerfBuckets(SPEED_LAG.needBuckets));
  const actual = perfActualSpeed(s);
  console.log(`이 기기에서는 ${formatSpeed(simSpeed)}배를 다 못 따라가 실제 약 ${actual === null ? '-' : actual.toFixed(1)}배로 돌고 있음 (목표 대비 ${perfSpeedPct(s)}%)`);
}
// 최근 k개 묶음 (오래된 것부터)
function recentPerfBuckets(k) {
  const n = Math.min(k, PERF.count);
  const out = [];
  for (let i = n; i >= 1; i--) out.push(PERF.ring[(PERF.head - i + PERF_HISTORY) % PERF_HISTORY]);
  return out;
}
function sumPerf(list) {
  const s = makePerfBucket();
  for (const b of list) {
    s.frames += b.frames; s.realMs += b.realMs; s.steps += b.steps; s.physMs += b.physMs; s.over33 += b.over33;
    s.skipped += b.skipped || 0;
    s.targetMs += b.targetMs || 0;
  }
  return s;
}
// 자동 화질 낮추기: 추첨/바람 중 최근 3초 평균 fps가 40 미만이면 배율을 한 단계 낮춤 (1.5 → 1.25 → 1.0). 다시 올리지 않음
function checkAutoQuality(closed) {
  const Q = CONFIG.autoQuality;
  if (!closed.windAll) {                         // 추첨/바람이 아닌 시간이 섞인 묶음 → 처음부터 다시 셈
    PERF.windBuckets = 0;
    return;
  }
  PERF.windBuckets++;
  if (PERF.windBuckets < Q.windowSec) return;
  const s = sumPerf(recentPerfBuckets(Q.windowSec));
  const fps = s.realMs > 0 ? s.frames * 1000 / s.realMs : 0;
  if (fps >= Q.minFps) return;
  const current = renderer.getPixelRatio();
  let next = null;
  for (const lv of Q.levels) {
    if (lv < current - 0.001) { next = lv; break; }
  }
  if (next === null) return;                     // 이미 최저(1.0)
  PERF.qualityCap = next;
  PERF.windBuckets = 0;                          // 낮춘 뒤 3초는 다시 판단하지 않음
  PERF.lowered.push({ to: next, fps: Math.round(fps * 10) / 10, atPhysicsSec: Math.round(getPhysicsTime() * 10) / 10 });
  renderer.setPixelRatio(getTargetPixelRatio());
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderDirty = true;                            // 다듬기(최적화): 화질이 바뀌었으니 다음 프레임은 반드시 그림
  console.log(`화면이 느려 그리는 해상도를 ${next}로 낮춤 (평균 ${fps.toFixed(1)}fps)`);
}
// ?fps=1 일 때 왼쪽 위 표시 갱신 (1초마다)
function updatePerfBox(b) {
  if (!PERF.enabled || !PERF.boxEl || !renderer) return;
  if (!b) b = PERF.count ? recentPerfBuckets(1)[0] : null;
  const fps = b && b.realMs > 0 ? (b.frames * 1000 / b.realMs).toFixed(1) : '-';
  const stepMs = b && b.steps > 0 ? (b.physMs / b.steps).toFixed(2) : '-';
  const perFrame = b && b.frames > 0 ? (b.steps / b.frames).toFixed(2) : '-';
  const pct = perfSpeedPct(b);                   // 목표(실제 시간 × 배속) 대비 %
  const speed = pct === null ? '-' : pct;
  PERF.boxEl.textContent =
    `fps ${fps}\n` +
    `물리 1회 ${stepMs}ms\n` +
    `프레임당 물리 ${perFrame}회\n` +
    `배속 ${formatSpeed(simSpeed)}배\n` +
    `물리 속도 ${speed}% (목표 대비)\n` +
    `해상도 배율 ${renderer.getPixelRatio().toFixed(2)}\n` +
    `화면 ${window.innerWidth}×${window.innerHeight}\n` +
    `그리기: ${renderSkipping ? '쉼' : '그림'}`;   // 다듬기(최적화): 멈춰 있을 때 그리기 쉬는 중인지
}
// 콘솔: lottoSim.perfReport() — 최근 10초 성능 요약 (?fps=1 없이도 동작)
function perfReport() {
  const list = recentPerfBuckets(PERF_HISTORY);
  if (PERF.cur.frames > 0 && list.length < PERF_HISTORY) list.push(PERF.cur);   // 아직 10초가 안 찼으면 지금 모으는 것도 포함
  const s = sumPerf(list);
  if (s.frames === 0) {
    console.log('성능 기록이 아직 없습니다. 화면이 몇 초 그려진 뒤 다시 실행해 주세요.');
    return null;
  }
  let minFps = Infinity;
  for (const b of list) if (b.realMs >= 500) minFps = Math.min(minFps, b.frames * 1000 / b.realMs);
  const r1 = (x) => Math.round(x * 10) / 10;
  const report = {
    seconds: r1(s.realMs / 1000),                              // 측정에 쓴 실제 시간 (최대 약 10초)
    avgFps: r1(s.frames * 1000 / s.realMs),                    // 평균 화면 장수
    minFps: minFps === Infinity ? null : r1(minFps),           // 1초 묶음 중 가장 낮은 fps
    physicsStepMs: s.steps ? Math.round(s.physMs / s.steps * 1000) / 1000 : null,   // 물리 계산 1회 평균 시간
    physicsStepsPerFrame: Math.round(s.steps / s.frames * 100) / 100,
    speed: simSpeed,                                           // 배속: 지금 고른 배속 (최근 10초 안에 바꿨으면 그 전 배속도 섞여 있음)
    physicsSpeedPct: perfSpeedPct(s),                          // 배속: 목표(실제 시간 × 배속) 대비 %. 100%면 고른 배속 그대로, 낮으면 못 따라감
    actualSpeed: Math.round(perfActualSpeed(s) * 100) / 100,   // 배속: 실제로 돈 배속 (물리 시간 ÷ 실제 시간)
    framesOver33msPct: r1(s.over33 / s.frames * 100),         // 30fps보다 느린 프레임 비율
    renderSkippedPct: r1(s.skipped / s.frames * 100),         // 다듬기(최적화): 그리기를 쉰 프레임 비율 (멈춰 있을 때만 쉼)
    pixelRatio: renderer.getPixelRatio(),
    devicePixelRatio: window.devicePixelRatio || 1,
    screen: `${window.innerWidth}×${window.innerHeight}`,
    autoQualityLowered: PERF.lowered.slice()
  };
  console.log(
    '===== 성능 요약 (최근 ' + report.seconds + '초) =====\n' +
    `  평균 fps: ${report.avgFps} / 최저 fps(1초 단위): ${report.minFps}\n` +
    `  30fps보다 느린 프레임(33ms 초과): ${report.framesOver33msPct}%\n` +
    `  그리기 쉰 프레임 비율: ${report.renderSkippedPct}% (공이 모두 멈추고 추첨·바람이 없을 때만 쉼, 배터리 절약용)\n` +
    `  물리 계산 1회 평균: ${report.physicsStepMs}ms, 프레임당 물리 계산: ${report.physicsStepsPerFrame}회\n` +
    `  배속: ${formatSpeed(report.speed)}배, 물리 속도: 목표 대비 ${report.physicsSpeedPct}% (실제 약 ${report.actualSpeed}배. 100%면 고른 배속 그대로, 낮으면 기기가 못 따라가 공이 더 느리게 움직임)\n` +
    `  그리는 해상도 배율: ${report.pixelRatio} (기기 배율 ${report.devicePixelRatio}), 화면 ${report.screen}\n` +
    `  자동으로 해상도를 낮춘 기록: ${report.autoQualityLowered.length ? report.autoQualityLowered.map(l => `${l.to} (평균 ${l.fps}fps)`).join(', ') : '없음'}`
  );
  return report;
}

// 앞 받침대 i번째 자리(왼쪽부터 0~6)의 공 중심 위치
function traySlotPos(i) {
  return new THREE.Vector3((i - (TRAY.count - 1) / 2) * TRAY.spacing, TRAY.topY + BALL_R, TRAY.z);
}

// ===== 물리 세계 =====
let ballMaterial, wallMaterial;
function createPhysicsWorld() {
  world = new CANNON.World();
  world.gravity.set(0, CONFIG.gravity, 0);
  world.allowSleep = true;                       // 멈춘 공은 계산 쉬기
  world.broadphase = new CANNON.SAPBroadphase(world);
  world.solver.iterations = CONFIG.solverIterations;

  ballMaterial = new CANNON.Material('ball');
  world.addContactMaterial(new CANNON.ContactMaterial(ballMaterial, ballMaterial, {
    friction: MATERIAL.ballBall.friction,
    restitution: MATERIAL.ballBall.restitution
  }));

  // 공↔통 벽 (접촉 강성·완화 값은 엔진 기본값 그대로 — 올리면 오히려 나빠짐, 시험 결과)
  wallMaterial = new CANNON.Material('wall');
  world.addContactMaterial(new CANNON.ContactMaterial(ballMaterial, wallMaterial, {
    friction: MATERIAL.ballWall.friction,
    restitution: MATERIAL.ballWall.restitution
  }));

  // 바람 돌풍 계산용 재사용 변수 (매 계산마다 새로 만들지 않음)
  windImpulse = new CANNON.Vec3();
  windPoint = new CANNON.Vec3(0, 0, 0);
  suctionForce = new CANNON.Vec3();

  // 물리 계산 한 번(고정 간격 1/120초) 직전마다 실행: 바람 돌풍, 빨아들이는 힘(입구 열린 동안만)
  world.addEventListener('preStep', applyWind);
  world.addEventListener('preStep', applySuction);

  // 물리 계산 한 번(고정 간격 1/120초) 끝날 때마다 실행:
  // 1) 공 속도 상한 2) 안전망 3) 섞임 점검 기록 4) 입구 닫는 중이면 근처 공 돌려보내기 5) 뽑기 흐름
  // 주의: 이 안에서는 물리 세계에 body를 넣거나 빼지 않는다 (엔진이 계산 중이라 오류 위험).
  //       넣고 빼기는 flushBodyChanges()가 world.step 뒤에 처리한다.
  // (다듬기: 이름 붙은 함수 onPostStep으로 분리 — lottoSim.profilePhysics가 잠시 바꿔 끼워 시간을 잼. 하는 일은 그대로)
  world.addEventListener('postStep', onPostStep);
}
function onPostStep() {
  physicsSteps++;                                // 물리 누적 시간 추적용
  capBallSpeeds();
  applySafetyNet();
  recordMixStats();
  if (gate.state === 'closing') pushGateRegionDown();
  drawFlowStep();
}
// 공 속도 상한
function capBallSpeeds() {
  const maxV = CONFIG.maxBallSpeed;
  for (const b of balls) {
    if (b.drawn) continue;
    const v = b.body.velocity;
    const len = v.length();
    if (len > maxV) v.scale(maxV / len, v);
  }
}

// world.step 뒤에 실행: 미뤄 둔 body 넣고 빼기 처리
function flushBodyChanges() {
  for (const b of pendingBallRemovals) {
    if (b.inWorld) {
      world.removeBody(b.body);
      b.inWorld = false;
    }
  }
  pendingBallRemovals.length = 0;
  if (gate.pendingRemove) {
    if (gate.inWorld) {
      world.removeBody(gate.panel);
      gate.inWorld = false;
    }
    gate.pendingRemove = false;
  }
  if (gate.state === 'closing') {
    if (gate.inWorld) {
      gate.state = 'closed';                     // 판을 빼기 전에 닫힘 요청이 온 경우
    } else if (gateRegionClear()) {
      world.addBody(gate.panel);                 // 판 자리에 공이 하나도 없을 때만 다시 넣음 (겹친 채로 넣지 않기)
      gate.inWorld = true;
      gate.state = 'closed';
    }
  }
}

// 물리 한 번 진행 (자동 점검용, 그리지 않음)
function stepOnce() {
  world.step(CONFIG.fixedStep);
  flushBodyChanges();
}

// ===== 바람 (돌풍 방식) =====
// 실제 추첨기 공기 세기·방식은 확인 못 함 — 화면에서 잘 섞이도록 정한 값 (CONFIG.wind)
// 바닥 구역(통 바닥에서 zoneHeight 이내)의 공마다, 계산 한 번마다 gustRate×fixedStep 확률로 위쪽 순간 충격을 준다.
// 무작위는 rand() (평소 Math.random 그대로, ?seed 때만 고정 난수. 재미용; 결과 예측 목적 아님)
function applyWind() {
  if (!windOn) return;
  const W = CONFIG.wind;
  const t = (physicsSteps - windStartStep) * CONFIG.fixedStep;   // 바람 켠 뒤 물리 시간
  const ramp = Math.min(1, t / W.rampTime);                      // 서서히 세짐 (0 → 1)
  if (ramp <= 0) return;
  const floorY = DRUM_CENTER.y - CONFIG.drumRadius;              // 통 바닥 높이
  const chance = W.gustRate * CONFIG.fixedStep;
  const side = W.gustSide * W.strength * ramp;
  for (const b of balls) {
    if (b.drawn) continue;
    const body = b.body;
    if (body.position.y - floorY >= W.zoneHeight) continue;
    if (rand() >= chance) continue;
    if (body.sleepState === CANNON.Body.SLEEPING) body.wakeUp();
    const up = W.gustUp * W.strength * ramp * (0.5 + 0.5 * rand());
    windImpulse.set(
      (rand() - 0.5) * 2 * side,
      up,
      (rand() - 0.5) * 2 * side
    );
    windImpulse.scale(body.mass, windImpulse);   // 질량을 곱해 '속도 변화'로 맞춤
    body.applyImpulse(windImpulse, windPoint);
  }
}

// ===== 빨아들이는 힘 (3단계, 입구 열린 동안만) =====
// 화면 조정값, 실제 확인 못 함 (CONFIG.draw.suction). 실제 기계가 공기로 빨아들이는지는 확인 못 함.
// 입구(구 꼭대기 안쪽 면)에서 radius 안의 공에, 입구 바로 위 점을 향하는 가속도 accel을 준다 (질량 곱해 힘으로).
// 가운데 축 쪽으로도 당기므로 공이 구멍 가운데로 모인다.
function applySuction() {
  if (!suctionOn) return;
  const S = CONFIG.draw.suction;
  const r2 = S.radius * S.radius;
  const aimY = HOLE_Y + CONFIG.draw.captureHeight + 0.3;
  for (const b of balls) {
    if (b.drawn) continue;
    const body = b.body;
    const p = body.position;
    const dx = p.x - DRUM_CENTER.x;
    const dy = p.y - HOLE_Y;
    const dz = p.z - DRUM_CENTER.z;
    if (dx * dx + dy * dy + dz * dz > r2) continue;
    const tx = -dx, ty = aimY - p.y, tz = -dz;
    const l = Math.sqrt(tx * tx + ty * ty + tz * tz);
    if (l < 1e-6) continue;
    if (body.sleepState === CANNON.Body.SLEEPING) body.wakeUp();
    const k = body.mass * S.accel / l;
    suctionForce.set(tx * k, ty * k, tz * k);
    body.force.vadd(suctionForce, body.force);
  }
}

// 바람 켜기/끄기
function setWind(on) {
  on = !!on;
  if (on === windOn) return;
  windOn = on;
  if (on) {
    windStartStep = physicsSteps;
    settlePending = false;
    // 섞임 점검 기록 초기화
    mix.upperReached = balls.map(() => false);
    mix.bins = [0, 0, 0, 0];
    mix.lastBinsPct = null;
    mix.safetyAtStart = safetyNetHits;
    mix.maxOutside = 0;
    for (const b of balls) if (!b.drawn) b.body.wakeUp();      // 바람을 켤 때 모든 공 깨우기
  } else {
    windOffStep = physicsSteps;
    settlePending = true;
  }
  updateStartButton();
}

// 시작 버튼 글자·잠김: 시작 전 "시작" → 추첨 중 "추첨 중 n/7"(잠김) → 끝나면 "추첨 완료"(잠김)
//                    → 다시 하기 뒤 공이 다 쌓일 때까지 "준비 중…"(잠김) → 다시 "시작"
// 다시 하기 버튼(따로 있음): 추첨 중·추첨 완료 때만 눌림. 시작 전·준비 중·자동 점검 중에는 잠김
function isDrawing() {
  return flow.phase === 'mixing' || flow.phase === 'waiting' || flow.phase === 'showing';
}
function updateStartButton() {
  const drawing = isDrawing();
  startBtn.classList.toggle('on', drawing);
  replayBtn.disabled = autoTest.running || replay.pending || !firstFrameDone || !(drawing || flow.phase === 'done');
  if (autoTest.running) {
    startBtn.textContent = '점검 중…';
    startBtn.disabled = true;
    return;
  }
  const total = CONFIG.draw.total;
  if (drawing) {
    startBtn.textContent = `추첨 중 ${Math.min(flow.index + 1, total)}/${total}`;
    startBtn.disabled = true;
  } else if (flow.phase === 'done') {
    startBtn.textContent = '추첨 완료';
    startBtn.disabled = true;
  } else if (replay.pending) {
    startBtn.textContent = '준비 중…';
    startBtn.disabled = true;
  } else {
    startBtn.textContent = '시작';
    startBtn.disabled = !firstFrameDone;         // 로딩이 끝난 뒤에만 누를 수 있음
  }
}

// ===== 섞임 점검 기록 (물리 계산마다) =====
function binsToPct(bins) {
  const total = bins[0] + bins[1] + bins[2] + bins[3];
  return bins.map(c => total > 0 ? Math.round(c / total * 100) : 0);
}
function countRemaining() {
  let n = 0;
  for (const b of balls) if (!b.drawn) n++;
  return n;
}
function recordMixStats() {
  if (windOn) {
    const floorY = DRUM_CENTER.y - CONFIG.drumRadius;
    const binH = (CONFIG.drumRadius * 2) / 4;    // 통 바닥~꼭대기를 4등분
    for (let i = 0; i < balls.length; i++) {
      if (balls[i].drawn) continue;
      const y = balls[i].body.position.y;
      if (y > DRUM_CENTER.y) mix.upperReached[i] = true;
      const k = Math.min(3, Math.max(0, Math.floor((y - floorY) / binH)));
      mix.bins[k]++;
    }
    const windSteps = physicsSteps - windStartStep;
    const logSteps = Math.round(CONFIG.mixLogInterval / CONFIG.fixedStep);
    const isLogStep = windSteps > 0 && windSteps % logSteps === 0;
    // 5단계: 통 밖 공 수는 물리 계산마다(1/120초) 대신 0.25초(물리 시간)마다 셈 (가볍게). 섞임 로그 순간에도 셈.
    // 통 밖 최대값 기록(mix.maxOutside, 자동 점검 maxOutside)도 이 간격으로 확인
    const outsideSteps = Math.max(1, Math.round(CONFIG.outsideCheckInterval / CONFIG.fixedStep));
    let out = 0;
    if (windSteps % outsideSteps === 0 || isLogStep) {
      out = countOutside();
      if (out > mix.maxOutside) mix.maxOutside = out;
      if (autoTest.running && out > autoTest.rec.maxOutside) autoTest.rec.maxOutside = out;
    }

    if (isLogStep) {
      const pct = binsToPct(mix.bins);
      if (!autoTest.running) {
        const s = getMixStats();
        console.log(`섞임 점검 — 바람 ${Math.round(s.windSeconds)}초: 위쪽 절반에 올라간 공 ${s.upperReachedCount}/${countRemaining()}, 높이 분포(아래→위) ${pct[0]}%/${pct[1]}%/${pct[2]}%/${pct[3]}%, 통 밖 공 수: ${out}, 안전망 작동: ${s.safetyNetHitsSinceWindOn}회`);
      }
      mix.lastBinsPct = pct;
      mix.bins = [0, 0, 0, 0];
    }
  } else if (settlePending) {
    const sleeping = countSleeping();
    const remaining = countRemaining();
    if (sleeping === remaining) {
      const sec = (physicsSteps - windOffStep) * CONFIG.fixedStep;
      if (!autoTest.running) console.log(`멈춤 후 안정 — 멈춘 공 ${sleeping}/${remaining} (바람 끈 뒤 ${sec.toFixed(1)}초)`);
      settlePending = false;
    }
  }
}

// 콘솔 점검용 섞임 정보
function getMixStats() {
  const reached = [];
  mix.upperReached.forEach((v, i) => { if (v && !balls[i].drawn) reached.push(balls[i].number); });
  return {
    windOn,
    windSeconds: windOn ? (physicsSteps - windStartStep) * CONFIG.fixedStep : 0,
    upperReachedCount: reached.length,         // 위쪽 절반에 한 번 이상 올라간 공 수 (바람 켤 때 초기화, 뽑힌 공 제외)
    upperReachedNumbers: reached,
    heightDistributionPct: binsToPct(mix.bins),  // 현재 점검 구간(최근 로그 이후)의 높이 분포 (아래→위)
    lastLoggedDistributionPct: mix.lastBinsPct,  // 바로 전 5초 점검 구간의 높이 분포
    outside: countOutside(),
    maxOutsideDuringWind: mix.maxOutside,
    safetyNetHitsSinceWindOn: safetyNetHits - mix.safetyAtStart,
    sleeping: countSleeping()
  };
}

// ===== 통 (충돌) — 축구공식 판 콜라이더 =====
// 오각형 12장 + 육각형 150장(=162장)의 두꺼운 판으로 구 안쪽 면을 덮는다. 판끼리 모서리가 정확히 맞물림.
// "속이 빈 구" 모양 하나가 아니라 볼록한 판 여러 장이라 엔진이 안정적으로 계산함.
// 만드는 법: 잘게 나눈 정이십면체(삼각형 구)의 꼭짓점 하나 = 판 하나, 그 꼭짓점을 둘러싼 삼각형들의 중심 = 판의 모서리 점
function buildPanelCells(detail) {
  const g = new THREE.IcosahedronGeometry(1, detail);
  const a = g.attributes.position.array;
  const key = (x, y, z) => x.toFixed(4) + ',' + y.toFixed(4) + ',' + z.toFixed(4);
  const verts = new Map();
  for (let i = 0; i < a.length; i += 9) {
    const ids = [];
    for (let k = 0; k < 3; k++) {
      const x = a[i+3*k], y = a[i+3*k+1], z = a[i+3*k+2];
      const kk = key(x, y, z);
      if (!verts.has(kk)) verts.set(kk, { p: [x, y, z], corners: [] });
      ids.push(kk);
    }
    const c = [0, 0, 0];
    for (const kk of ids) { const p = verts.get(kk).p; c[0]+=p[0]; c[1]+=p[1]; c[2]+=p[2]; }
    const l = Math.hypot(c[0], c[1], c[2]);
    for (const kk of ids) verts.get(kk).corners.push([c[0]/l, c[1]/l, c[2]/l]);
  }
  g.dispose();
  return [...verts.values()].map(v => { const l = Math.hypot(...v.p); return { n: v.p.map(x => x / l), corners: v.corners }; });
}
function makePanelBody(cell, R, T, material) {
  const V = (q) => new CANNON.Vec3(q[0], q[1], q[2]);
  const n = V(cell.n);
  const c0 = V(cell.corners[0]);
  const ref = c0.vsub(n.scale(c0.dot(n))); ref.normalize();
  const ref2 = n.cross(ref);
  const cs = cell.corners.map(V).sort((p, q) => Math.atan2(p.dot(ref2), p.dot(ref)) - Math.atan2(q.dot(ref2), q.dot(ref)));
  const k = cs.length;
  const center = n.scale(R + T / 2);
  const inner = cs.map(d => d.scale(R / d.dot(n)).vsub(center));        // 안쪽 면(공이 닿는 면)은 평평하게
  const outer = cs.map(d => d.scale((R + T) / d.dot(n)).vsub(center));
  const faces = [[...Array(k).keys()].reverse(), [...Array(k).keys()].map(i => i + k)];
  for (let i = 0; i < k; i++) { const j = (i + 1) % k; faces.push([i, j, j + k, i + k]); }
  return new CANNON.Body({ mass: 0, material, shape: new CANNON.ConvexPolyhedron({ vertices: [...inner, ...outer], faces }), position: center });
}

// 입구 구멍 크기 계산: 맨 위 오각형 판의 안쪽 면(평평한 오각형)의 안쪽 원·바깥 원 반지름
function measureGateHole(cell) {
  const R = CONFIG.drumRadius;
  const n = new THREE.Vector3(...cell.n);
  const c0 = new THREE.Vector3(...cell.corners[0]);
  const ref = c0.clone().addScaledVector(n, -c0.dot(n)).normalize();
  const ref2 = new THREE.Vector3().crossVectors(n, ref);
  const pts = cell.corners
    .map(c => new THREE.Vector3(...c))
    .sort((p, q) => Math.atan2(p.dot(ref2), p.dot(ref)) - Math.atan2(q.dot(ref2), q.dot(ref)))
    .map(d => d.multiplyScalar(R / d.dot(n)));                 // 안쪽 면 위의 꼭짓점
  const center = n.clone().multiplyScalar(R);
  let circR = 0, inR = Infinity;
  const e = new THREE.Vector3(), w = new THREE.Vector3(), c = new THREE.Vector3();
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    circR = Math.max(circR, a.distanceTo(center));
    e.subVectors(b, a);
    w.subVectors(center, a);
    inR = Math.min(inR, c.crossVectors(w, e).length() / e.length()); // 가운데에서 변까지 거리
  }
  gate.inR = inR;
  gate.circR = circR;
  gate.tanAngle = inR / R;
  console.log(`입구 구멍 크기: 안쪽 원 지름 ${(inR * 2).toFixed(2)} (공 지름 ${BALL_R * 2}), 꼭짓점까지 지름 ${(circR * 2).toFixed(2)}`);
  if (inR * 2 <= BALL_R * 2) console.warn('입구 구멍이 공 지름보다 작아 공이 지나갈 수 없음 — 판 나누기 설정 확인 필요');
}

// 판 162장을 만들어 물리 세계에 넣는다 (화면에는 그리지 않음 — 보이는 통은 매끈한 투명 구)
function createDrumCollider() {
  const cells = buildPanelCells(CONFIG.wallPanelDetail);

  // 오각형 판 1장이 정확히 통 맨 아래(-Y 방향)에 오도록 모든 판을 같은 회전으로 돌린다.
  // 정이십면체 꼭짓점은 서로 정반대쪽에 짝이 있으므로 맨 위(+Y)에도 오각형 판이 온다.
  // 3단계: 이 맨 위 오각형 1장을 입구 마개(gate.panel)로 쓴다 — 뽑을 때만 빼서 구멍을 연다.
  const firstPentagon = cells.find(c => c.corners.length === 5);
  const q = new THREE.Quaternion().setFromUnitVectors(
    new THREE.Vector3(...firstPentagon.n),
    new THREE.Vector3(0, -1, 0)
  );
  const tmp = new THREE.Vector3();
  const rot = (p) => { tmp.set(p[0], p[1], p[2]).applyQuaternion(q); return [tmp.x, tmp.y, tmp.z]; };
  for (const c of cells) {
    c.n = rot(c.n);
    c.corners = c.corners.map(rot);
  }

  // 맨 위(+Y)를 향한 판 = 입구 마개
  let gateCell = cells[0];
  for (const c of cells) if (c.n[1] > gateCell.n[1]) gateCell = c;
  if (gateCell.corners.length !== 5) console.warn('맨 위 판이 오각형이 아님 — 입구 모양 확인 필요');
  measureGateHole(gateCell);

  const offset = new CANNON.Vec3(DRUM_CENTER.x, DRUM_CENTER.y, DRUM_CENTER.z);
  for (const cell of cells) {
    const body = makePanelBody(cell, CONFIG.drumRadius, CONFIG.wallThickness, wallMaterial);
    body.position.vadd(offset, body.position);   // 통 중심 기준으로 옮김
    body.previousPosition.copy(body.position);
    body.interpolatedPosition.copy(body.position);
    body.aabbNeedsUpdate = true;
    world.addBody(body);
    if (cell === gateCell) gate.panel = body;
  }
  gate.inWorld = true;
  gate.state = 'closed';
}

// ===== 맨 위 칸 (충돌, 3단계) =====
// 구멍 바로 위, 통 바깥쪽에 공 1개 들어가는 짧은 원통 칸. 정적 상자를 원 모양으로 세운 벽 + 위 덮개 상자 1개.
// 공은 칸 아래(구멍 안)에서 잡혀 물리에서 빠지므로 보통은 닿지 않는다. 칸 밖으로 새는 것을 막는 보호벽 역할.
function createChamberCollider() {
  const D = CONFIG.draw;
  const nWall = D.chamberWallCount;
  const t = D.chamberWallThickness;
  const rIn = D.chamberInnerR;
  const h = D.chamberHeight;
  const rc = rIn + t / 2;                                     // 상자 가운데 반지름
  const halfW = (rIn + t) * Math.tan(Math.PI / nWall) + 0.02; // 이웃 상자와 틈 없게
  const up = new CANNON.Vec3(0, 1, 0);
  for (let i = 0; i < nWall; i++) {
    const a = i / nWall * Math.PI * 2;
    const body = new CANNON.Body({
      mass: 0,
      material: wallMaterial,
      shape: new CANNON.Box(new CANNON.Vec3(t / 2, h / 2, halfW)),
      position: new CANNON.Vec3(DRUM_CENTER.x + Math.cos(a) * rc, CHAMBER_BASE_Y + h / 2, DRUM_CENTER.z + Math.sin(a) * rc)
    });
    body.quaternion.setFromAxisAngle(up, -a);                 // 상자 두께 방향(x)을 바깥쪽으로
    world.addBody(body);
  }
  const cover = new CANNON.Body({
    mass: 0,
    material: wallMaterial,
    shape: new CANNON.Box(new CANNON.Vec3(rIn + t, t / 2, rIn + t)),
    position: new CANNON.Vec3(DRUM_CENTER.x, CHAMBER_TOP_Y + t / 2, DRUM_CENTER.z)
  });
  world.addBody(cover);
}

// ===== 입구 열기/닫기 (3단계) =====
// 실제 기계의 입구 마개 구조는 확인 못 함 — 판 1장을 빼고 넣는 방식은 이 시뮬레이터의 설계
function openGate() {
  gate.state = 'open';
  gate.pendingRemove = true;                     // 이번 물리 계산이 끝난 뒤 판을 뺌
}
function closeGate() {
  if (gate.state === 'closed') return;
  gate.state = 'closing';                        // 판 자리가 비면 flushBodyChanges()가 다시 넣음
  gate.pendingRemove = false;
  pushGateRegionDown();
}
// 공이 입구 판 자리(판 부피)와 겹치거나 그 위(구멍·칸)에 있는지
function isInGateRegion(p) {
  const dx = p.x - DRUM_CENTER.x, dy = p.y - DRUM_CENTER.y, dz = p.z - DRUM_CENTER.z;
  if (dy <= 0) return false;
  const lim = gate.circR + BALL_R;
  if (dx * dx + dz * dz > lim * lim) return false;
  const rIn = CONFIG.drumRadius - BALL_R - 0.05;
  return dx * dx + dy * dy + dz * dz > rIn * rIn;
}
function gateRegionClear() {
  for (const b of balls) {
    if (b.drawn) continue;
    if (isInGateRegion(b.body.position)) return false;
  }
  return true;
}
// 입구 근처 공에 아래 방향 속도를 줘서 통 안으로 돌려보냄
function pushGateRegionDown() {
  const vDown = -CONFIG.draw.pushBackSpeed;
  for (const b of balls) {
    if (b.drawn) continue;
    const body = b.body;
    if (!isInGateRegion(body.position)) continue;
    if (body.sleepState === CANNON.Body.SLEEPING) body.wakeUp();
    if (body.velocity.y > vDown) body.velocity.y = vDown;
  }
}
// 입구가 열려 있는 동안 안전망·통 밖 판정에서 빼는 곳: 구멍 원뿔(맨 위 방향과 이루는 각 < 구멍 각) + 맨 위 칸 안
function isInExitPath(p) {
  const dx = p.x - DRUM_CENTER.x, dy = p.y - DRUM_CENTER.y, dz = p.z - DRUM_CENTER.z;
  if (dy <= 0) return false;
  const hor = Math.sqrt(dx * dx + dz * dz);
  if (hor < dy * gate.tanAngle) return true;
  return p.y > HOLE_Y && hor < CHAMBER_OUTER_R;
}

// ===== 안전망 =====
// 빠른 충돌·바람 중 쌓인 공 눌림 때 작동하는 안전망 (벽의 일부로 유지).
// - 빠른 충돌에서 엔진 접촉이 공을 덜 막아 판을 통과하는 경우(시험에서 확인)
// - 바람 중 바닥에 쌓인 공이 위에서 떨어지는 공에 눌려 벽에 파고드는 경우 (시험: 10초에 약 50~70회, 탈출 0.
//   접촉 반복 횟수를 늘려도 거의 줄지 않았음)
// 가만히 쌓인 상태에서는 거의 작동하지 않음. 작동 횟수는 lottoSim.safetyNetHits()로 확인
// 공 중심이 정상 접촉 위치(통 반지름 - 공 반지름)보다 safetyNetDepth 넘게 벽 쪽으로 들어가면 안쪽으로 되돌림
// 3단계: 뽑힌 공은 건너뜀. 입구 판이 빠져 있는 동안 구멍 원뿔·맨 위 칸 안의 공은 되돌리지 않음
function applySafetyNet() {
  const lim = CONFIG.drumRadius - BALL_R + CONFIG.safetyNetDepth;
  const e = MATERIAL.ballWall.restitution;       // 공↔통 튕김 (출처 불확실)
  const holeOpen = !gate.inWorld;
  for (const b of balls) {
    if (b.drawn) continue;
    const body = b.body;
    const p = body.position;
    const dx = p.x - DRUM_CENTER.x;
    const dy = p.y - DRUM_CENTER.y;
    const dz = p.z - DRUM_CENTER.z;
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (d <= lim) continue;
    if (holeOpen && isInExitPath(p)) continue;
    safetyNetHits++;
    const nx = dx / d, ny = dy / d, nz = dz / d;
    p.x = DRUM_CENTER.x + nx * lim;
    p.y = DRUM_CENTER.y + ny * lim;
    p.z = DRUM_CENTER.z + nz * lim;
    // 화면 보간용 이전 위치도 같은 곳으로 맞춰 한 프레임 튀어 보이지 않게
    body.previousPosition.copy(p);
    body.interpolatedPosition.copy(p);
    body.aabbNeedsUpdate = true;

    // 이미 잠든 공은 위치만 고치고 속도는 건드리지 않음
    if (body.sleepState === CANNON.Body.SLEEPING) continue;
    const v = body.velocity;
    const vn = v.x * nx + v.y * ny + v.z * nz;    // 바깥 방향 속도
    if (vn > 0) {
      const k = vn * (1 + e);
      v.x -= nx * k;
      v.y -= ny * k;
      v.z -= nz * k;
    }
  }
}

// ===== 공 떨어뜨릴 위치 (구 안쪽 격자, 겹치지 않게, 약간의 무작위 흔들림) =====
function makeSpawnPoints(count) {
  const spacing = BALL_R * 2 * 1.25;          // 공 지름보다 넓은 간격 → 겹치지 않음
  const maxS = BALL_MAX_DIST - 0.3;           // 구 중심에서 이 거리 안쪽에만 배치
  const n = Math.floor(maxS / spacing);
  const jitter = () => (rand() - 0.5) * 0.2; // 흔들림(±0.1)을 더해도 간격 1.25 > 지름 1 이라 안 겹침
  const pts = [];
  // 구 아래쪽부터 한 층씩 위로 채움 (층마다 구 단면 원 안에 있는 격자점만)
  for (let iy = -n; iy <= n && pts.length < count; iy++) {
    const dy = iy * spacing;
    const layerR2 = maxS * maxS - dy * dy;     // 이 높이에서 구 단면 반지름의 제곱
    if (layerR2 <= 0) continue;
    for (let ix = -n; ix <= n; ix++) {
      for (let iz = -n; iz <= n; iz++) {
        const x = ix * spacing;
        const z = iz * spacing;
        if (x * x + z * z <= layerR2 && pts.length < count) {
          pts.push({
            x: DRUM_CENTER.x + x + jitter(),
            y: DRUM_CENTER.y + dy + jitter(),
            z: DRUM_CENTER.z + z + jitter()
          });
        }
      }
    }
  }
  // 번호가 한쪽에 몰리지 않게 위치 섞기
  for (let i = pts.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [pts[i], pts[j]] = [pts[j], pts[i]];
  }
  return pts;
}

// 공 물리 몸체 1개 (다듬기: 검사용 새 물리 세계에서도 같은 값으로 만들려고 함수로 뺌. 값은 그대로)
function makeBallBody(shape, p) {
  return new CANNON.Body({
    mass: CONFIG.ballMass,
    material: ballMaterial,
    shape: shape,
    // 처음 위치를 여기서 주면 보간용 이전 위치도 같은 곳으로 잡혀서 첫 화면에서 튀지 않음
    position: new CANNON.Vec3(p.x, p.y, p.z),
    linearDamping: CONFIG.ballLinearDamping,
    angularDamping: CONFIG.ballAngularDamping,
    allowSleep: true,
    sleepSpeedLimit: CONFIG.sleepSpeedLimit,
    sleepTimeLimit: CONFIG.sleepTimeLimit
  });
}

// ===== 공 45개 만들기 =====
function createBalls() {
  const geometry = new THREE.SphereGeometry(BALL_R, 20, 14); // 면 수를 줄인 공 모양 (모든 공이 함께 씀)
  const shape = new CANNON.Sphere(BALL_R);
  const spawn = makeSpawnPoints(CONFIG.ballCount);

  for (let i = 0; i < CONFIG.ballCount; i++) {
    const number = i + 1;

    const mesh = new THREE.Mesh(
      geometry,
      new THREE.MeshLambertMaterial({ map: makeBallTexture(number) })
    );
    scene.add(mesh);

    const p = spawn[i];
    const body = makeBallBody(shape, p);
    // 번호가 여러 방향을 보도록 처음 방향을 무작위로
    body.quaternion.setFromEuler(
      rand() * Math.PI * 2,
      rand() * Math.PI * 2,
      rand() * Math.PI * 2
    );
    body.previousQuaternion.copy(body.quaternion);
    body.interpolatedQuaternion.copy(body.quaternion);
    world.addBody(body);

    // drawn: 뽑혀서 물리에서 빠진 공, inWorld: 물리 세계에 들어 있는지,
    // anim: 뽑힌 공 화면 이동(곡선·시작 시각·걸리는 시간), viewPos: 뽑힌 공이 머무는 화면 위치
    balls.push({ number, body, mesh, drawn: false, inWorld: true, anim: null, viewPos: null });
  }
}

// ===== 점검: 공 번호 =====
function validateBallNumbers(list) {
  const problems = [];
  if (list.length !== 45) problems.push(`공 개수가 45개가 아님 (${list.length}개)`);
  const seen = new Set();
  for (const b of list) {
    const n = b.number;
    if (!Number.isInteger(n)) {
      problems.push(`정수가 아닌 번호: ${n}`);
      continue;
    }
    if (n < 1 || n > 45) problems.push(`범위(1~45) 밖 번호: ${n}`);
    if (seen.has(n)) problems.push(`중복 번호: ${n}`);
    seen.add(n);
  }
  if (problems.length === 0) {
    return { ok: true, message: '공 번호 점검: 통과 (45개, 중복 없음, 1~45 범위)' };
  }
  return { ok: false, message: '공 번호 점검: 실패 — ' + problems.join(', ') };
}

// ===== 점검: 통 밖으로 나간 공 수 =====
// 구 중심에서 거리 > (통 반지름 - 공 반지름 + 여유) 이면 통 밖으로 셈
// 3단계: 뽑힌 공은 세지 않음. 입구 판이 빠져 있는 동안 구멍·맨 위 칸을 지나는 공도 세지 않음
function countOutside() {
  const limit = CONFIG.drumRadius - BALL_R + CONFIG.outsideMargin;
  const holeOpen = !gate.inWorld;
  let n = 0;
  for (const b of balls) {
    if (b.drawn) continue;
    const p = b.body.position;
    const d = Math.hypot(p.x - DRUM_CENTER.x, p.y - DRUM_CENTER.y, p.z - DRUM_CENTER.z);
    if (d > limit && !(holeOpen && isInExitPath(p))) n++;
  }
  return n;
}

// ===== 점검: 멈춘(잠든) 공 수 (뽑힌 공 제외) =====
function countSleeping() {
  let n = 0;
  for (const b of balls) {
    if (b.drawn) continue;
    if (b.body.sleepState === CANNON.Body.SLEEPING) n++;
  }
  return n;
}

// 처음 10초는 1초마다, 그 뒤는 5초마다 콘솔에 기록
function periodicOutsideCheck() {
  if (simTime < nextCheckTime) return;
  const n = countOutside();
  console.log(`통 밖 공 수: ${n}`);
  if (!tenSecLogged && simTime >= 10) {
    console.log(`10초 점검 — 통 밖 공 수: ${n}, 멈춘(잠든) 공 수: ${countSleeping()}/${countRemaining()} (물리 시간 ${getPhysicsTime().toFixed(1)}초), 안전망 작동: ${safetyNetHits}회`);
    tenSecLogged = true;
  }
  nextCheckTime += (nextCheckTime < 10) ? 1 : 5;
}

// ===== 뽑힌 공 처리 (공통) =====
// 물리에서 빼기(실제 빼기는 world.step 뒤 flushBodyChanges에서)
function markDrawn(b) {
  b.drawn = true;
  pendingBallRemovals.push(b);
}
// 뽑힌 공 화면 이동: curve를 따라 dur초(물리 시간) 동안 움직인 뒤 끝점에 머묾
function setDrawnAnim(b, curve, dur) {
  b.viewPos = curve.getPoint(1);
  b.anim = { curve, t0: getPhysicsTime(), dur };
}
function updateDrawnMesh(b, t) {
  if (b.anim) {
    const a = b.anim;
    let u = (t - a.t0) / a.dur;
    if (u >= 1) {
      b.anim = null;
      b.mesh.position.copy(b.viewPos);
    } else {
      if (u < 0) u = 0;
      a.curve.getPoint(u * u * (3 - 2 * u), b.mesh.position);   // 부드럽게 출발·도착
    }
  } else if (b.viewPos) {
    b.mesh.position.copy(b.viewPos);
  }
  b.mesh.lookAt(camera.position);                // 공의 +Z(번호 라벨) 쪽을 카메라로 → 번호가 똑바로 보임
}
// 순간이동: 맨 위 칸 → 기계 앞 받침대 i번째 자리
function placeOnTray(b, i) {
  b.anim = null;
  b.viewPos = traySlotPos(i);
}

// ===== 결과 결정 방식 (공 하나를 정하는 부분) =====
// 두 방식은 같은 모양(start / update / cancel)을 가져서 CONFIG.selectionMode 하나로 바꿔 끼울 수 있다.
// start(ctx): 입구 열림 시점에 호출, update(ctx): 물리 계산마다 호출 → 공이 맨 위 칸에 들어오면 그 공을 돌려줌,
// cancel(ctx): 하던 일을 멈춤. 흐름(섞기·보여 주기·순간이동)은 선택기 바깥 공통 코드(drawFlowStep)가 맡는다.
const PhysicsSelector = {
  name: 'physics',
  boostCount: 0,
  // 입구를 열고 빨아들이는 힘을 켬
  start(ctx) {
    this.boostCount = 0;
    openGate();
    suctionOn = true;
  },
  // 입구 칸 기준 높이를 처음 넘은 공 1개를 잡음. 오래 안 잡히면 바람을 세게
  update(ctx) {
    const D = CONFIG.draw;
    const W = CONFIG.wind;
    const waited = (physicsSteps - ctx.openStep) * CONFIG.fixedStep;
    if (waited >= D.maxWait + this.boostCount * D.boostInterval && W.strength < D.boostMax) {
      W.strength = Math.min(D.boostMax, W.strength * D.boostFactor);
      this.boostCount++;
      windBoostEvents++;
      if (!autoTest.running) console.log(`입구 열린 뒤 ${waited.toFixed(1)}초 동안 안 잡혀 바람 배율을 ${W.strength.toFixed(2)}로 올림`);
    }
    const captureY = HOLE_Y + D.captureHeight;
    const horLim = D.chamberInnerR + 0.3;
    let best = null, bestY = captureY;
    for (const b of balls) {
      if (b.drawn) continue;
      const p = b.body.position;
      if (p.y <= bestY) continue;
      if (Math.hypot(p.x - DRUM_CENTER.x, p.z - DRUM_CENTER.z) > horLim) continue;
      best = b;
      bestY = p.y;
    }
    if (!best) return null;
    // 잡힘: 빨아들이기 끄기 → 물리에서 빼기 → 칸 안 자리로 살짝 올리기 → 입구 닫기(근처 공 돌려보낸 뒤)
    suctionOn = false;
    markDrawn(best);
    const p0 = new THREE.Vector3(best.body.position.x, best.body.position.y, best.body.position.z);
    setDrawnAnim(best, new THREE.LineCurve3(p0, chamberBallPos.clone()), D.riseTime);
    closeGate();
    return best;
  },
  cancel(ctx) {
    suctionOn = false;
    if (gate.state === 'open') closeGate();
  }
};

const RandomSelector = {
  name: 'random',
  ball: null,
  doneStep: 0,
  // 남은 공 중 하나를 난수(rand, 평소 Math.random)로 정하고 물리에서 뺀 뒤 곡선 경로(현재 위치 → 구멍 → 칸)로 보냄
  start(ctx) {
    const left = balls.filter(b => !b.drawn);
    const b = left[Math.floor(rand() * left.length)];
    markDrawn(b);
    const bp = b.body.position;
    const p0 = new THREE.Vector3(bp.x, bp.y, bp.z);
    const p1 = new THREE.Vector3(
      DRUM_CENTER.x + (bp.x - DRUM_CENTER.x) * 0.3,
      Math.min(HOLE_Y - 0.6, Math.max(bp.y + 0.5, HOLE_Y - 1.8)),
      DRUM_CENTER.z + (bp.z - DRUM_CENTER.z) * 0.3
    );
    const p2 = new THREE.Vector3(DRUM_CENTER.x, HOLE_Y - 0.2, DRUM_CENTER.z);
    const curve = new THREE.CatmullRomCurve3([p0, p1, p2, chamberBallPos.clone()]);
    setDrawnAnim(b, curve, CONFIG.draw.randomPathTime);
    this.ball = b;
    this.doneStep = physicsSteps + Math.round(CONFIG.draw.randomPathTime / CONFIG.fixedStep);
  },
  // 곡선 이동이 끝나면 그 공을 돌려줌
  update(ctx) {
    if (this.ball && physicsSteps >= this.doneStep) {
      const b = this.ball;
      this.ball = null;
      return b;
    }
    return null;
  },
  cancel(ctx) {
    this.ball = null;
  }
};

function getSelector() {
  return CONFIG.selectionMode === 'random' ? RandomSelector : PhysicsSelector;
}

// ===== 뽑기 흐름 (공통, 3단계) =====
// 시작 → 바람 켜짐 → [섞기 3초 → 입구 열림 → 공 1개 잡힘 → 맨 위 칸에서 2초 → 앞 받침대로 순간이동] × 7
// 시간은 모두 물리 시간 기준 (물리 계산마다 postStep에서 진행)
function enterPhase(p) {
  flow.phase = p;
  flow.phaseStep = physicsSteps;
}
function phaseElapsed() {
  return (physicsSteps - flow.phaseStep) * CONFIG.fixedStep;
}
function startDraw() {
  if (flow.phase !== 'idle') return false;
  if (replay.pending && !autoTest.running) return false;   // 다시 하기 후 공이 쌓이는 중
  flow.numbers = [];
  flow.index = 0;
  flow.current = null;
  flow.startStep = physicsSteps;
  CONFIG.wind.strength = 1;
  enterPhase('mixing');
  setWind(true);
  updateStartButton();
  return true;
}
function drawFlowStep() {
  const D = CONFIG.draw;
  switch (flow.phase) {
    case 'mixing':
      if (phaseElapsed() >= D.mixTime) {
        flow.openStep = physicsSteps;
        flow.stuck = false;
        flow.selector = getSelector();
        enterPhase('waiting');
        flow.selector.start(flow);
      }
      break;
    case 'waiting': {
      const b = flow.selector.update(flow);
      if (b) {
        onBallCaptured(b);
        break;
      }
      const waited = (physicsSteps - flow.openStep) * CONFIG.fixedStep;
      if (flow.selector === PhysicsSelector && waited >= D.stuckTime) {
        // 끼임: 입구 열린 뒤 30초 안에 안 잡힘 → 이 뽑기는 난수 방식으로 대신 뽑음
        flow.stuck = true;
        console.warn(`끼임 — 뽑기 ${flow.index + 1}/${D.total}: 입구 열린 뒤 ${D.stuckTime}초 안에 안 잡힘 → 이번 뽑기는 난수 방식으로 대신 뽑음`);
        PhysicsSelector.cancel(flow);
        flow.selector = RandomSelector;
        RandomSelector.start(flow);
      }
      break;
    }
    case 'showing':
      if (phaseElapsed() >= D.showTime) {
        placeOnTray(flow.current, flow.index);
        if (!autoTest.running) showResultNumber(flow.index, flow.current.number);   // 4단계: 순간이동과 같은 순간에 번호 표시
        flow.current = null;
        flow.index++;
        if (flow.index >= D.total) finishDraw();
        else enterPhase('mixing');
        updateStartButton();
      }
      break;
  }
}
function onBallCaptured(b) {
  const D = CONFIG.draw;
  const waitSec = (physicsSteps - flow.openStep) * CONFIG.fixedStep;
  const strength = CONFIG.wind.strength;
  CONFIG.wind.strength = 1;                      // 공이 잡히면 바람 배율을 1로 되돌림
  if (flow.numbers.includes(b.number)) {
    console.error(`중복 번호 발생: ${b.number}번이 이번 회차에서 두 번 나옴`);
  }
  flow.numbers.push(b.number);
  flow.current = b;
  if (!autoTest.running) {
    console.log(`뽑기 ${flow.index + 1}/${D.total} — 번호 ${b.number}, 입구 열린 뒤 ${waitSec.toFixed(2)}초, 바람 배율 ${Number(strength.toFixed(2))}` +
      (flow.stuck ? ' (끼임 → 난수 방식으로 대신 뽑음)' : ''));
  } else {
    autoTestOnDraw(b.number, waitSec, strength, flow.stuck);
  }
  enterPhase('showing');
}
function finishDraw() {
  flow.phase = 'done';
  setWind(false);
  CONFIG.wind.strength = 1;
  const total = (physicsSteps - flow.startStep) * CONFIG.fixedStep;
  if (!autoTest.running) {
    console.log(`추첨 완료 — [${flow.numbers.slice(0, 6).join(', ')}] (보너스 ${flow.numbers[6]}), 총 ${total.toFixed(1)}초`);   // 뽑힌 순서
    console.log(`정렬: [${sortedMain(flow.numbers).join(', ')}] (보너스 ${flow.numbers[6]})`);
    announceResult(flow.numbers);                // 화면 읽기 프로그램용 결과 문장 (일반 6개는 작은 수부터)
    scheduleSortResultBar(flow.numbers);         // 화면 아래 번호 표시 일반 6칸 정렬 (3D 앞 받침대 공은 뽑힌 순서 그대로)
  }
}

// ===== 다시 하기 (4단계) =====
// 다시 하기 버튼(따로 있음)을 추첨 중 또는 추첨 완료 뒤 누르면: 받침대·맨 위 칸·번호 표시 비우기(정렬 예약 취소 포함),
// 공 45개를 처음 배치로 되돌려 떨어뜨림 (resetSimulation 재사용 — 바람 끔, 빨아들이기 끔, 바람 배율 1, 입구 판 닫힘,
// 대기 중인 body 넣기/빼기 목록 정리, 선택기 cancel, 흐름·끼임 타이머 초기화).
// 추첨 중(섞기/입구 열림/칸에서 보여 주는 중/난수 방식 곡선 이동 중) 어느 단계에서 눌러도 같은 상태로 되돌아감.
// 공이 다 쌓일 때까지(잠든 공 45/45 또는 최대 4초) 버튼 잠금.
// world.step 바깥(버튼 클릭)에서만 호출한다 → 물리 계산 도중에 body를 넣고 빼지 않음.
function startReplay() {
  if (autoTest.running || replay.pending) return false;
  const drawing = isDrawing();
  if (!drawing && flow.phase !== 'done') return false;
  if (drawing) {
    console.log(`다시 하기 — 추첨 중단(${Math.min(flow.index + 1, CONFIG.draw.total)}/${CONFIG.draw.total}에서), 공 45개 되돌림`);
  } else {
    console.log('다시 하기 — 공 45개 되돌림');
  }
  clearResultBar();
  replay.pending = true;
  replay.startStep = physicsSteps;
  replay.hadFocus = document.activeElement === replayBtn;   // 5단계: 키보드 사용자용 포커스 옮기기

  resetSimulation();                             // 안에서 버튼도 갱신 → "준비 중…"
  return true;
}
// 매 프레임 물리 진행 뒤 확인: 다 쌓였으면 "시작"으로 되돌림
function checkReplayReady() {
  if (!replay.pending) return;
  const sec = (physicsSteps - replay.startStep) * CONFIG.fixedStep;
  const sleeping = countSleeping();
  if (sleeping === balls.length || sec >= replay.maxWait) {
    replay.pending = false;
    console.log(`다시 준비 완료 (${sec.toFixed(1)}초)` + (sleeping === balls.length ? '' : ` — 최대 ${replay.maxWait}초가 지나 멈춘 공 ${sleeping}/${balls.length}에서 준비 완료`));
    updateStartButton();
    // 5단계: 다시 하기 버튼에 포커스가 있었으면(키보드 사용자) "시작"이 된 시작 버튼으로 포커스를 옮김.
    // 다시 하기 버튼이 잠기면서 포커스가 문서 전체(body)로 빠진 경우도 포함. 그 사이 다른 곳을 눌렀으면 옮기지 않음
    const ae = document.activeElement;
    if (replay.hadFocus && !startBtn.disabled && (ae === replayBtn || ae === document.body || ae === null)) {
      startBtn.focus();
    }
    replay.hadFocus = false;
  }
}

// 콘솔 점검용: 현재 뽑기 상태
function getDrawState() {
  const names = { idle: '시작 전', mixing: '섞는 중', waiting: '입구 열림(공 기다리는 중)', showing: '맨 위 칸에서 보여 주는 중', done: '추첨 완료' };
  return {
    phase: flow.phase,
    phaseName: names[flow.phase],
    drawing: isDrawing() ? flow.index + 1 : null,      // 지금 몇 번째 공을 뽑는 중인지
    total: CONFIG.draw.total,
    numbers: flow.numbers.slice(),                     // 뽑힌 번호 (순서대로, 7번째가 보너스)
    mode: flow.selector ? flow.selector.name : CONFIG.selectionMode,
    gate: gate.state,
    secondsSinceGateOpen: flow.phase === 'waiting' ? (physicsSteps - flow.openStep) * CONFIG.fixedStep : null,
    windOn,
    windStrength: CONFIG.wind.strength,
    autoTestRunning: autoTest.running
  };
}

// ===== 처음 상태로 되돌리기 (자동 점검용, 4단계 다시 하기에도 사용) =====
// 공 45개를 통 안 처음 배치(makeSpawnPoints)로, 바람 끔, 입구 닫음, 받침대 비움, 흐름 '시작 전'.
// world.step 바깥에서만 호출한다.
function resetSimulation() {
  if (flow.selector) flow.selector.cancel(flow);
  flow.phase = 'idle';
  flow.index = 0;
  flow.numbers = [];
  flow.current = null;
  flow.selector = null;
  flow.stuck = false;
  flow.openStep = physicsSteps;                  // 끼임 타이머 초기화 (다음 입구 열림 때 다시 정해짐)
  flow.phaseStep = physicsSteps;
  suctionOn = false;
  windOn = false;
  settlePending = false;
  CONFIG.wind.strength = 1;
  pendingBallRemovals.length = 0;
  if (!gate.inWorld) {
    world.addBody(gate.panel);
    gate.inWorld = true;
  }
  gate.state = 'closed';
  gate.pendingRemove = false;
  const spawn = makeSpawnPoints(balls.length);
  balls.forEach((b, i) => {
    const body = b.body;
    if (!b.inWorld) {
      world.addBody(body);
      b.inWorld = true;
    }
    b.drawn = false;
    b.anim = null;
    b.viewPos = null;
    const p = spawn[i];
    body.position.set(p.x, p.y, p.z);
    body.previousPosition.copy(body.position);
    body.interpolatedPosition.copy(body.position);
    body.velocity.set(0, 0, 0);
    body.angularVelocity.set(0, 0, 0);
    body.force.set(0, 0, 0);
    body.torque.set(0, 0, 0);
    body.quaternion.setFromEuler(rand() * Math.PI * 2, rand() * Math.PI * 2, rand() * Math.PI * 2);
    body.previousQuaternion.copy(body.quaternion);
    body.interpolatedQuaternion.copy(body.quaternion);
    body.aabbNeedsUpdate = true;
    body.wakeUp();
  });
  updateStartButton();
}

// ===== 자동 뽑기 점검 (그리지 않는 빠른 모드) =====
// 시뮬레이터 점검용이며 실제 로또와 관계없음.
// n = 뽑을 공 수(기본 1000). 7개 한 회차를 반복: 회차마다 처음 배치 → 바람 끈 채 3초 쌓기 → 실제와 같은 흐름.
// options.mode: 'physics' | 'random' (없으면 CONFIG.selectionMode)
function yieldToBrowser() {
  return new Promise(r => setTimeout(r, 0));
}
function autoTestOnDraw(number, waitSec, strength, stuck) {
  const rec = autoTest.rec;
  rec.draws++;
  rec.counts[number]++;
  if (stuck) {
    rec.stuck++;
    rec.stuckList.push({ draw: rec.draws, round: rec.rounds, number });
  } else {
    rec.waits.push(waitSec);
  }
  if (strength > 1) rec.boostDraws++;
  if (rec.draws % 100 === 0) {
    console.log(`점검 진행: ${rec.draws}/${rec.n}개 (실제 경과 ${((performance.now() - rec.t0) / 1000).toFixed(0)}초)`);
  }
}
async function runAutoTest(n = 1000, options = {}) {
  if (autoTest.running) {
    console.warn('이미 자동 점검이 진행 중입니다.');
    return null;
  }
  if (!world || !firstFrameDone) {
    console.warn('추첨기 준비가 끝난 뒤 다시 실행해 주세요.');
    return null;
  }
  if (harness.active) {
    console.warn('다른 검사가 진행 중입니다. 끝난 뒤 다시 실행해 주세요.');
    return null;
  }
  n = Math.max(1, Math.floor(Number(n) || 1000));
  const mode = options.mode === 'random' || options.mode === 'physics' ? options.mode : CONFIG.selectionMode;
  const savedMode = CONFIG.selectionMode;
  CONFIG.selectionMode = mode;
  // 다듬기: options.seed가 있으면 고정 난수 + 검사용 새 물리 세계에서 돌려 같은 결과가 나오게 (끝나면 원래 시드 설정·화면용 세계로)
  const seeded = options.seed !== undefined && options.seed !== null;
  const savedSeed = seedValue;
  if (seeded) setSeed(options.seed);
  const D = CONFIG.draw;
  const dt = CONFIG.fixedStep;
  const rec = {
    n, mode, draws: 0, rounds: 0, stuck: 0, stuckList: [], waits: [], boostDraws: 0,
    counts: new Array(46).fill(0), roundDup: [], maxOutside: 0, t0: performance.now()
  };
  autoTest.rec = rec;
  autoTest.running = true;
  replay.pending = false;                        // 다시 하기 대기 중이었다면 취소 (점검이 어차피 공을 되돌림)
  cancelSortTimers();                            // 번호 정렬 예약이 남아 있으면 취소 (점검 중 번호 표시가 바뀌지 않게)
  updateStartButton();
  console.log(`자동 뽑기 점검 시작 — 시뮬레이터 점검용이며 실제 로또와 관계없음 (공 ${n}개, 방식 ${mode}). 끝날 때까지 이 탭을 열어 두세요.`);

  // 4단계: 아래 전체를 try로 감싸고 마무리 복원은 finally에서 → 결과 계산 중 예외가 나도 버튼이 영구 잠기지 않음
  // (들여쓰기는 바꾸지 않음 — 이 try는 맨 아래 "finally (마무리 복원)"까지 이어짐)
  let finalResult = null;
  try {
  const boostStart = windBoostEvents;
  const safetyStart = safetyNetHits;
  const stepStart = physicsSteps;
  const settleSteps = Math.round(D.autoTestSettleTime / dt);
  const roundCap = Math.round((D.autoTestSettleTime + D.total * (D.mixTime + D.stuckTime + D.randomPathTime + D.showTime + 1) + 10) / dt);
  const YIELD_EVERY = 300;                       // 이만큼 물리 계산할 때마다 브라우저에 양보 (멈춤 방지)
  let k = 0;
  let aborted = false;
  try {
    if (seeded) useTestPhysics();
    while (rec.draws < n) {
      resetSimulation();
      for (let i = 0; i < settleSteps; i++) {
        stepOnce();
        if (++k % YIELD_EVERY === 0) await yieldToBrowser();
      }
      rec.rounds++;
      startDraw();
      let steps = 0;
      while (flow.phase !== 'done' && rec.draws < n) {
        stepOnce();
        steps++;
        if (++k % YIELD_EVERY === 0) await yieldToBrowser();
        if (steps > roundCap) {
          console.error('자동 점검: 한 회차가 너무 오래 걸려 중단함');
          aborted = true;
          break;
        }
      }
      rec.roundDup.push(flow.numbers.length - new Set(flow.numbers).size);
      if (aborted) break;
    }
  } catch (e) {
    console.error('자동 점검 중 오류', e);
    aborted = true;
  }

  // ----- 결과 정리 -----
  const sorted = rec.waits.slice().sort((a, b) => a - b);
  const len = sorted.length;
  const pick = (p) => len ? sorted[Math.min(len - 1, Math.max(0, Math.ceil(p * len) - 1))] : null;
  const r2 = (x) => x === null ? null : Math.round(x * 100) / 100;
  const histogram = [];
  if (len) {
    const nb = Math.floor(sorted[len - 1]) + 1;
    for (let i = 0; i < nb; i++) histogram.push({ range: `${i}~${i + 1}초`, count: 0 });
    for (const t of sorted) histogram[Math.floor(t)].count++;
  }
  const numberCounts = {};
  let cMin = Infinity, cMax = -Infinity;
  for (let i = 1; i <= 45; i++) {
    numberCounts[i] = rec.counts[i];
    cMin = Math.min(cMin, rec.counts[i]);
    cMax = Math.max(cMax, rec.counts[i]);
  }
  const numsWith = (c) => Object.keys(numberCounts).filter(k2 => numberCounts[k2] === c).map(Number);
  const result = {
    note: '시뮬레이터 점검용이며 실제 로또와 관계없음',
    mode,
    seed: seeded ? seedValue : null,
    requested: n,
    drawn: rec.draws,
    rounds: rec.rounds,
    completed: !aborted && rec.draws >= n,
    stuckCount: rec.stuck,
    stuckDraws: rec.stuckList,
    duplicatesPerRound: rec.roundDup,
    duplicateTotal: rec.roundDup.reduce((a, b) => a + b, 0),
    waitSeconds: {
      count: len,                                   // 끼임 제외
      min: r2(len ? sorted[0] : null),
      median: r2(pick(0.5)),
      mean: r2(len ? sorted.reduce((a, b) => a + b, 0) / len : null),
      p90: r2(pick(0.9)),
      max: r2(len ? sorted[len - 1] : null),
      histogram
    },
    windBoostEvents: windBoostEvents - boostStart,
    drawsWithWindBoost: rec.boostDraws,
    numberCounts,
    numberCountMin: { count: cMin, numbers: numsWith(cMin) },
    numberCountMax: { count: cMax, numbers: numsWith(cMax) },
    expectedPerNumber: Math.round(n / 45 * 100) / 100,
    maxOutside: rec.maxOutside,
    safetyNetHits: safetyNetHits - safetyStart,
    realSeconds: Math.round((performance.now() - rec.t0) / 100) / 10,
    physicsSeconds: Math.round((physicsSteps - stepStart) * dt * 10) / 10
  };

  // ----- 콘솔 출력 -----
  const ws = result.waitSeconds;
  console.log('===== 자동 뽑기 점검 결과 — 시뮬레이터 점검용이며 실제 로또와 관계없음 =====');
  console.log(`방식: ${mode}, 뽑은 공: ${rec.draws}/${n}개 (회차 ${rec.rounds}번)${result.completed ? '' : ' — 중간에 멈춤'}`);
  console.log(`끼임(입구 열린 뒤 ${D.stuckTime}초 안에 안 잡힘): ${rec.stuck}회` +
    (rec.stuck ? ' → ' + rec.stuckList.map(s => `${s.draw}번째(회차 ${s.round}, 대신 뽑은 번호 ${s.number})`).join(', ') : ''));
  console.log(`회차별 중복 번호 수: 합계 ${result.duplicateTotal} (모든 회차 0이어야 정상)`);
  console.log(`잡히기까지 걸린 시간(입구 열린 뒤, 끼임 제외 ${ws.count}개): 최소 ${ws.min} / 중앙값 ${ws.median} / 평균 ${ws.mean} / 90% ${ws.p90} / 최대 ${ws.max} 초`);
  if (histogram.length) {
    const hMax = Math.max(...histogram.map(h => h.count));
    console.log('걸린 시간 분포 (1초 간격):\n' + histogram.map(h =>
      `  ${h.range.padStart(7)}: ${String(h.count).padStart(4)} ${'■'.repeat(Math.round(h.count / hMax * 40))}`).join('\n'));
  }
  console.log(`바람 배율이 올라간 횟수: ${result.windBoostEvents}회 (배율이 올라간 상태에서 잡힌 뽑기 ${rec.boostDraws}개)`);
  console.log(`번호별 나온 횟수 (기대값 ${result.expectedPerNumber}): 최소 ${cMin}회(번호 ${result.numberCountMin.numbers.join(', ')}) / 최대 ${cMax}회(번호 ${result.numberCountMax.numbers.join(', ')})`);
  const rows = [];
  for (let i = 1; i <= 45; i += 9) {
    const cells = [];
    for (let j = i; j < i + 9 && j <= 45; j++) cells.push(`${String(j).padStart(2)}:${String(numberCounts[j]).padStart(3)}`);
    rows.push('  ' + cells.join('  '));
  }
  console.log('번호:횟수\n' + rows.join('\n'));
  console.log(`통 밖 공 수 최대값: ${result.maxOutside} (입구를 지나는 중인 공은 제외)`);
  console.log(`안전망 작동: ${result.safetyNetHits}회`);
  console.log(`걸린 실제 시간: ${result.realSeconds}초 (물리 시간 ${result.physicsSeconds}초)`);
  console.log('결과는 lottoSim.autoTestResult 에 저장됨');
  if (window.lottoSim) window.lottoSim.autoTestResult = result;
  finalResult = result;
  } finally {
    // ----- finally (마무리 복원): 화면 상태를 처음으로 — 예외가 나도 항상 실행 -----
    CONFIG.selectionMode = savedMode;
    autoTest.running = false;
    autoTest.rec = null;
    replay.pending = false;
    if (seeded) {
      setSeed(savedSeed);
      restoreScreenPhysics();
    }
    try {
      resetSimulation();
    } catch (e) {
      console.error('자동 점검 뒤 되돌리기 중 오류', e);
    }
    clearResultBar();                            // 점검이 끝나면 번호 표시도 빈 상태로
    renderDirty = true; renderRested = false;    // 다듬기(최적화): 점검 뒤 첫 프레임은 반드시 다시 그림
    lastTime = performance.now();
    updateStartButton();
  }
  return finalResult;
}

// =====================================================================
// ===== 다듬기: 검사 도구 (2026-11-24) — 검사용이며 평소 사용에는 쓰이지 않음 =====
// 시뮬레이터 점검용이며 실제 로또와 관계없음.
// 모든 검사 함수는 그리지 않는 빠른 모드(자동 점검과 같은 방식: world.step 한 번 → 몸체 넣고 빼기)로 돈다.
// world.step 도중에는 몸체를 넣고 빼지 않는다 (기존 규칙 그대로, 넣고 빼기는 flushBodyChanges·resetSimulation·아래 useTestPhysics에서만).
// 끝나면 finally에서 자동 점검과 같은 정리(resetSimulation + 번호 칸 비우기)로 화면을 처음 상태로 되돌린다.
// =====================================================================
const HARNESS_YIELD = 300;                 // 이만큼 물리 계산할 때마다 브라우저에 양보 (멈춤 방지)
const CHECK_EVERY_STEPS = Math.round(0.25 / CONFIG.fixedStep);   // 규칙 검사 간격 (물리 0.25초)
const harnessSaved = { seed: null, mode: 'physics', log: null };

// 같은 시드 → 같은 결과를 위해: 검사 회차마다 물리 세계를 통째로 새로 만든다
// (새 CANNON.World·재질·벽 판 162장·입구 판·칸 벽·공 몸체 45개를 init과 같은 순서로).
// 이전 방식(기존 세계의 몸체 순서·엔진 시간만 맞추기)은 페이지를 연 뒤 화면 모드에서 쌓인 몸체·엔진 내부 상태가 남아
// 페이지마다 결과가 달랐음(2026-11-24 차등 검사에서 발견). 화면용 세계는 그대로 보관했다가 끝나면 되돌린다.
const screenPhys = { active: false, world: null, ballMaterial: null, wallMaterial: null, windImpulse: null, windPoint: null, suctionForce: null, gatePanel: null, gateInWorld: true, bodies: [], inWorld: [] };
function useTestPhysics() {
  if (!screenPhys.active) {                      // 처음 한 번만 화면용 세계를 보관
    screenPhys.active = true;
    screenPhys.world = world;
    screenPhys.ballMaterial = ballMaterial;
    screenPhys.wallMaterial = wallMaterial;
    screenPhys.windImpulse = windImpulse;
    screenPhys.windPoint = windPoint;
    screenPhys.suctionForce = suctionForce;
    screenPhys.gatePanel = gate.panel;
    screenPhys.gateInWorld = gate.inWorld;
    screenPhys.bodies = balls.map(b => b.body);
    screenPhys.inWorld = balls.map(b => b.inWorld);
  }
  pendingBallRemovals.length = 0;
  createPhysicsWorld();                          // 새 세계 + 재질 + preStep/postStep 연결 (world 등 전역이 새 것으로 바뀜)
  createDrumCollider();                          // 벽 판 162장 (gate.panel·gate.inWorld·gate.state도 새로)
  createChamberCollider();
  const shape = new CANNON.Sphere(BALL_R);
  for (const b of balls) {
    b.body = makeBallBody(shape, { x: DRUM_CENTER.x, y: DRUM_CENTER.y, z: DRUM_CENTER.z });   // 위치는 바로 뒤 resetSimulation이 정함
    world.addBody(b.body);
    b.inWorld = true;
  }
  gate.pendingRemove = false;
  suctionOn = false;
  windOn = false;
}
function restoreScreenPhysics() {
  if (!screenPhys.active) return;
  world = screenPhys.world;
  ballMaterial = screenPhys.ballMaterial;
  wallMaterial = screenPhys.wallMaterial;
  windImpulse = screenPhys.windImpulse;
  windPoint = screenPhys.windPoint;
  suctionForce = screenPhys.suctionForce;
  gate.panel = screenPhys.gatePanel;
  gate.inWorld = screenPhys.gateInWorld;
  gate.pendingRemove = false;
  balls.forEach((b, i) => {
    b.body = screenPhys.bodies[i];
    b.inWorld = screenPhys.inWorld[i];
  });
  pendingBallRemovals.length = 0;
  screenPhys.active = false;
  screenPhys.world = null;
  screenPhys.bodies = [];
  screenPhys.inWorld = [];
}
function harnessReady(name) {
  if (!world || !firstFrameDone) {
    console.warn(`${name}: 추첨기 준비가 끝난 뒤 다시 실행해 주세요.`);
    return false;
  }
  if (harness.active || autoTest.running) {
    console.warn(`${name}: 다른 검사나 자동 점검이 진행 중입니다.`);
    return false;
  }
  return true;
}
function beginHarness() {
  harnessSaved.seed = seedValue;
  harnessSaved.mode = CONFIG.selectionMode;
  harnessSaved.log = console.log;
  harness.active = true;
